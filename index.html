  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const paths = {
        building: <><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></>,

        file: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></>,
        alert: <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></>,
        plus: <><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></>,
        arrowDown: <><line x1="12" x2="12" y1="5" y2="19"/><polyline points="19 12 12 19 5 12"/></>,

        transfer: <><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></>,
        logout: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>,
        wallet: <><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></>,
        book: <><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h8"/><path d="M8 11h6"/></>,
        camera: <><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></>,
        ruler: <><path d="M21.3 8.7 8.7 21.3a1 1 0 0 1-1.4 0l-4.6-4.6a1 1 0 0 1 0-1.4L15.3 2.7a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4z"/><path d="m7.5 10.5 2 2M10.5 7.5l2 2M13.5 4.5l2 2M4.5 13.5l2 2"/></>,
        shield: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></>,
        search: <><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></>,
        chevronLeft: <><polyline points="15 18 9 12 15 6"/></>,
        chevronRight: <><polyline points="9 18 15 12 9 6"/></>,
        print: <><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></>
      };
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || null}
        </svg>
      );
    };

    const BtnAcao = ({ onClick, perigo, children }) => (
      <button type="button" onClick={onClick}
        className={`text-xs font-bold px-2 py-1 rounded mr-1 border transition ${perigo ? 'border-red-200 text-red-700 hover:bg-red-50' : 'border-slate-300 text-slate-700 hover:bg-slate-100'}`}>
        {children}
      </button>
    );


    const formatBRL = (val) => Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    // ---------- Datas sempre no fuso local (evita "pular" de dia após 21h por causa do UTC) ----------
    const pad2 = (n) => String(n).padStart(2, '0');
    const isoLocal = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const hojeISO = () => isoLocal(new Date());
    const somaDias = (dias) => { const d = new Date(); d.setDate(d.getDate() + dias); return isoLocal(d); };
    const somaDiasDe = (iso, dias) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + dias); return isoLocal(d); };
    const fmtData = (iso) => (iso && /^\d{4}-\d{2}-\d{2}/.test(iso)) ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) + iso.slice(10) : (iso || '-');
    const CATEGORIAS_PADRAO = ['Cimentos e argamassas', 'Agregados', 'Alvenaria', 'Aço e ferragens', 'Hidráulica', 'Elétrica', 'Acabamentos', 'Madeiras', 'Ferramentas e EPI', 'Geral'];
    const NOMES_MES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    const diasDoMes = (mes) => { const [a, m] = mes.split('-').map(Number); return new Date(a, m, 0).getDate(); };
    const semAcento = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    // Gráfico de barras horizontais simples (sem biblioteca)
    const BarrasH = ({ itens, formato = (v) => v, vazio = 'Sem dados para exibir.' }) => {
      const max = Math.max(1, ...itens.flatMap(i => (i.series || [{ valor: i.valor }]).map(x => Number(x.valor) || 0)));
      if (!itens.length) return <p className="text-sm text-slate-400">{vazio}</p>;
      return (
        <div className="space-y-3">
          {itens.map((i, idx) => (
            <div key={idx}>
              <div className="flex justify-between text-xs mb-1 gap-2">
                <span className="font-bold text-slate-700 truncate">{i.rotulo}</span>
                {!i.series && <span className="text-slate-600 font-semibold whitespace-nowrap">{formato(i.valor)}</span>}
              </div>
              {(i.series || [{ valor: i.valor, cor: i.cor || 'bg-amber-500' }]).map((sr, k) => (
                <div key={k} className="flex items-center gap-2 mb-1">
                  <div className="flex-1 bg-slate-100 h-3 rounded-full overflow-hidden">
                    <div className={`h-full rounded-full ${sr.cor}`} style={{ width: `${Math.max(0, (Number(sr.valor) || 0) / max * 100)}%` }}></div>
                  </div>
                  {i.series && <span className="text-[11px] text-slate-600 w-40 shrink-0 text-right whitespace-nowrap">{sr.nome}: <strong>{formato(sr.valor)}</strong></span>}
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    };

    const rotuloMes = (mes) => `${NOMES_MES[Number(mes.slice(5, 7)) - 1]} de ${mes.slice(0, 4)}`;
    const somaMes = (mes, delta) => { const [a, m] = mes.split('-').map(Number); const d = new Date(a, m - 1 + delta, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };
    // Mesma regra do banco (fechar_folha): diária x presenças; mensal - (salário/30 x faltas)
    const calcularPagamento = (rem, cont) => {
      if (!rem || !(rem.valor > 0)) return 0;
      if (rem.tipo === 'Diária') return Math.round(rem.valor * cont.Presente * 100) / 100;
      return Math.max(0, Math.round((rem.valor - rem.valor / 30 * cont.Falta) * 100) / 100);
    };

    const CLIMAS = ['Bom', 'Nublado', 'Chuva', 'Impraticável'];
    const TIPOS_DOC = ['ASO (exame ocupacional)', 'NR-35 Trabalho em altura', 'NR-10 Eletricidade', 'NR-18 Construção civil', 'NR-12 Máquinas', 'NR-06 EPI', 'NR-33 Espaço confinado', 'Contrato', 'Seguro de vida', 'Alvará / licença', 'Outro'];
    const AVISO_DIAS = 30;
    const diasAte = (iso) => { if (!iso) return null; const [a, m, d] = iso.split('-').map(Number); const h = new Date(); return Math.round((new Date(a, m - 1, d) - new Date(h.getFullYear(), h.getMonth(), h.getDate())) / 86400000); };
    const situacaoDoc = (doc) => { const n = diasAte(doc.validade); if (n === null) return 'Sem validade'; if (n < 0) return 'Vencido'; if (n <= AVISO_DIAS) return 'Vence em breve'; return 'Em dia'; };
    // Reduz a foto (máx. 1600 px, JPEG 80%) antes de enviar: economiza dados do celular e espaço no Supabase
    const comprimirImagem = (file) => new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const esc = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('Não foi possível ler a imagem.')), 'image/jpeg', 0.8);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Arquivo de imagem inválido.')); };
      img.src = url;
    });

    const proximoCodigo = (materiais) => {
      const max = materiais.reduce((acc, m) => {
        const n = parseInt(String(m.codigo || '').replace(/\D/g, ''), 10);
        return isNaN(n) ? acc : Math.max(acc, n);
      }, 0);
      return 'MAT-' + String(max + 1).padStart(3, '0');
    };

    // ---------- Permissões por perfil (a regra de verdade está no banco: supabase/schema.sql) ----------
    const PERMISSOES = {
      'Engenheiro': {
        abaInicial: 'dashboard',
        abas: ['materiais', 'dashboard', 'obras', 'diario', 'compras', 'financeiro', 'medicoes', 'funcionarios', 'epi', 'documentos', 'folha', 'relatorios', 'usuarios'],
        acoes: ['*'],
      },
      'Almoxarife': {
        abaInicial: 'materiais',
        abas: ['materiais', 'obras', 'diario', 'compras', 'epi', 'relatorios'],
        acoes: ['mov.Entrada', 'mov.Saída', 'mov.Transferência', 'mov.estornar', 'material.gerir', 'fornecedor.gerir', 'compra.criar', 'compra.editar', 'compra.receber', 'epi.entregar', 'epi.cancelar'],
      },
      'Mestre de Obras': {
        abaInicial: 'materiais',
        abas: ['materiais', 'obras', 'diario', 'compras', 'funcionarios', 'epi', 'documentos'],
        acoes: ['mov.Saída', 'compra.criar', 'func.presenca', 'diario.gerir', 'epi.entregar'],
      },
    };

    // ---------- Conexão com o Supabase ----------
    const SUPABASE_CONFIGURADO = SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.length > 20;
    const sb = SUPABASE_CONFIGURADO ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const DADOS_VAZIOS = { obras: [], materiais: [], movimentacoes: [], fornecedores: [], compras: [], despesas: [], funcionarios: [], perfis: [], presencas: [], remuneracoes: {}, presencasFolha: [], folha: null, folhaItens: [], diarios: [], presencasDiario: [], documentos: [], epis: [], contratos: [], contratoItens: [], medicoes: [], medicaoItens: [] };

    // Converte timestamptz do banco para "AAAA-MM-DD HH:MM" no horário local
    const tsLocal = (ts) => { const d = new Date(ts); return `${isoLocal(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
    const num = (v) => v === null || v === undefined ? v : Number(v);

    // Lança erro do Supabase de forma amigável
    const ok = ({ data, error }) => {
      if (error) {
        const msg = error.message || String(error);
        if (/row-level security|permission denied|Sem permissão/i.test(msg)) throw new Error('Seu perfil não tem permissão para esta operação.');
        if (/violates foreign key/i.test(msg)) throw new Error('Este registro está vinculado a outros lançamentos e não pode ser excluído.');
        if (/duplicate key.*codigo/i.test(msg)) throw new Error('Já existe um material com este código.');
        throw new Error(msg);
      }
      return data;
    };

    async function carregarDados(perfil, mesPresenca, mesFolha, diaDiario) {
      const eng = perfil === 'Engenheiro';
      const iniF = mesFolha + '-01', fimF = mesFolha + '-' + pad2(diasDoMes(mesFolha));
      const iniMes = mesPresenca + '-01';
      const fimMes = mesPresenca + '-' + pad2(diasDoMes(mesPresenca));
      const consultas = [
        sb.from('obras').select('*').order('criado_em'),
        sb.from('materiais').select('*').order('codigo'),
        sb.from('estoques').select('*'),
        sb.from('movimentacoes').select('*').order('data', { ascending: false }).limit(1000),
        sb.from('fornecedores').select('*').order('nome'),
        sb.from('compras').select('*').order('data_solicitacao', { ascending: false }),
        sb.from('funcionarios').select('*').order('nome'),
        perfil === 'Engenheiro' ? sb.from('despesas').select('*').order('vencimento', { ascending: false }) : Promise.resolve({ data: [] }),
        perfil === 'Engenheiro' ? sb.from('perfis').select('*').order('criado_em') : Promise.resolve({ data: [] }),
        sb.from('presencas').select('funcionario_id, dia, status').gte('dia', iniMes).lte('dia', fimMes),
        eng ? sb.from('remuneracoes').select('*') : Promise.resolve({ data: [] }),
        eng ? sb.from('presencas').select('funcionario_id, dia, status').gte('dia', iniF).lte('dia', fimF) : Promise.resolve({ data: [] }),
        eng ? sb.from('folhas').select('*').eq('mes', mesFolha) : Promise.resolve({ data: [] }),
        eng ? sb.from('folha_itens').select('*').eq('mes', mesFolha) : Promise.resolve({ data: [] }),
        sb.from('diarios').select('*').order('dia', { ascending: false }).limit(400),
        sb.from('presencas').select('funcionario_id, dia, status').eq('dia', diaDiario),
        (eng || perfil === 'Mestre de Obras') ? sb.from('documentos').select('*').order('validade', { ascending: true }) : Promise.resolve({ data: [] }),
        sb.from('epi_entregas').select('*').order('dia', { ascending: false }).order('criado_em', { ascending: false }).limit(2000),
        eng ? sb.from('contratos').select('*').order('criado_em', { ascending: true }) : Promise.resolve({ data: [] }),
        eng ? sb.from('contrato_itens').select('*').order('ordem', { ascending: true }) : Promise.resolve({ data: [] }),
        eng ? sb.from('medicoes').select('*').order('numero', { ascending: true }) : Promise.resolve({ data: [] }),
        eng ? sb.from('medicao_itens').select('*') : Promise.resolve({ data: [] }),
      ];
      const [obras, materiais, estoques, movs, forns, compras, funcs, despesas, perfis, presencas, rems, presF, folhas, itensF, diarios, presDiario, documentos, epis, contratos, contItens, medicoes, medItens] = (await Promise.all(consultas)).map(ok);
      const fotos = diarios.length ? ok(await sb.from('diario_fotos').select('*').in('diario_id', diarios.map(d => d.id)).order('criado_em')) : [];
      return {
        obras: obras.map(o => ({ ...o, orcamento: num(o.orcamento) })),
        materiais: materiais.map(m => {
          const est = {};
          estoques.filter(e => e.material_id === m.id).forEach(e => { est[e.obra_id] = num(e.saldo); });
          return { id: m.id, codigo: m.codigo, nome: m.nome, categoria: m.categoria || 'Geral', unidade: m.unidade, min: num(m.estoque_minimo), estoques: est };
        }),
        movimentacoes: movs.map(m => ({
          id: m.id, data: tsLocal(m.data), tipo: m.tipo, tipoOriginal: m.tipo_original, estornoDe: m.estorno_de,
          estornada: m.estornada, obraId: m.obra_id, obraDestinoId: m.obra_destino_id, materialId: m.material_id,
          qtd: num(m.qtd), responsavel: m.responsavel, obs: m.obs
        })),
        fornecedores: forns,
        compras: compras.map(c => ({
          id: c.id, obraId: c.obra_id, materialId: c.material_id, fornecedorId: c.fornecedor_id, qtd: num(c.qtd),
          precoUnit: num(c.preco_unit), entrega: c.entrega, status: c.status, solicitante: c.solicitante, dataSolicitacao: c.data_solicitacao
        })),
        despesas: despesas.map(d => ({ id: d.id, compraId: d.compra_id, obraId: d.obra_id, descricao: d.descricao, categoria: d.categoria, valor: num(d.valor), vencimento: d.vencimento, status: d.status })),
        funcionarios: funcs.map(f => ({ id: f.id, nome: f.nome, funcao: f.funcao, obraId: f.obra_id, presenca: f.presenca })),
        perfis,
        presencas: presencas.map(p => ({ funcionarioId: p.funcionario_id, dia: p.dia, status: p.status })),
        remuneracoes: Object.fromEntries(rems.map(r => [r.funcionario_id, { tipo: r.tipo, valor: num(r.valor) }])),
        presencasFolha: presF.map(p => ({ funcionarioId: p.funcionario_id, dia: p.dia, status: p.status })),
        folha: folhas[0] ? { ...folhas[0], total: num(folhas[0].total) } : null,
        folhaItens: itensF.map(i => ({ ...i, valor_base: num(i.valor_base), valor_calculado: num(i.valor_calculado), ajuste: num(i.ajuste), total: num(i.total) })),
        diarios: diarios.map(d => ({ ...d, fotos: fotos.filter(f => f.diario_id === d.id) })),
        presencasDiario: presDiario.map(p => ({ funcionarioId: p.funcionario_id, status: p.status })),
        documentos,
        epis: epis.map(e => ({ ...e, qtd: num(e.qtd) })),
        contratos: contratos.map(c => ({ ...c, retencao_pct: num(c.retencao_pct) })),
        contratoItens: contItens.map(i => ({ ...i, qtd: num(i.qtd), preco_unit: num(i.preco_unit) })),
        medicoes: medicoes.map(m => ({ ...m, valor_bruto: num(m.valor_bruto), retencao: num(m.retencao), valor_liquido: num(m.valor_liquido) })),
        medicaoItens: medItens.map(i => ({ ...i, qtd: num(i.qtd) })),
      };
    }

    const Moldura = ({ children }) => (
      <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
        <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
          <div className="bg-amber-500 p-6 text-slate-950">
            <div className="flex items-center gap-3">
              <div className="bg-slate-950 text-amber-400 p-2.5 rounded-xl">
                <Icon name="building" className="w-7 h-7" />
              </div>
              <div>
                <h1 className="text-2xl font-black tracking-tight">SIGO</h1>
                <p className="text-xs font-semibold uppercase tracking-wider text-slate-900/80">Sistema Integrado de Gestão de Obras</p>
              </div>
            </div>
          </div>
          <div className="p-6 space-y-5">{children}</div>
        </div>
      </div>
    );

    function App() {
      const [user, setUser] = useState(null);          // { id, email, nome, perfil }
      const [carregandoSessao, setCarregandoSessao] = useState(true);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginSenha, setLoginSenha] = useState('');
      const [loginErro, setLoginErro] = useState('');
      const [enviando, setEnviando] = useState(false);
      const [modoCadastro, setModoCadastro] = useState(false);
      const [cadastroNome, setCadastroNome] = useState('');
      const [loginInfo, setLoginInfo] = useState('');

      const [data, setData] = useState(DADOS_VAZIOS);
      const [sincronizado, setSincronizado] = useState(null);   // horário da última leitura
      const [erroConexao, setErroConexao] = useState('');

      const [activeTab, setActiveTab] = useState('materiais');
      const [buscaEstoque, setBuscaEstoque] = useState('');
      const [filtroCategoria, setFiltroCategoria] = useState('');
      const [diaPresenca, setDiaPresenca] = useState(hojeISO());
      const mesPresenca = diaPresenca.slice(0, 7);
      const [mesFolha, setMesFolha] = useState(hojeISO().slice(0, 7));
      const [ajustesFolha, setAjustesFolha] = useState({});
      const [diarioObra, setDiarioObra] = useState('');
      const [diarioDia, setDiarioDia] = useState(hojeISO());
      const [diarioForm, setDiarioForm] = useState(null);     // rascunho em edição
      const [fotoUrls, setFotoUrls] = useState({});           // caminho -> URL assinada
      const [enviandoFotos, setEnviandoFotos] = useState(0);
      const [docModal, setDocModal] = useState(false);
      const [docForm, setDocForm] = useState({});
      const [docArquivo, setDocArquivo] = useState(null);
      const [filtroDoc, setFiltroDoc] = useState('');
      const [buscaDoc, setBuscaDoc] = useState('');
      const [epiModal, setEpiModal] = useState(false);
      const [epiForm, setEpiForm] = useState({});
      const [epiFiltroFunc, setEpiFiltroFunc] = useState('');
      const [fichaEpi, setFichaEpi] = useState(null);   // id do funcionário com a ficha aberta
      const [contratoSel, setContratoSel] = useState('');
      const [contratoModal, setContratoModal] = useState(false);
      const [contratoForm, setContratoForm] = useState({});
      const [medModal, setMedModal] = useState(false);
      const [medForm, setMedForm] = useState({});
      const [boletim, setBoletim] = useState(null);     // id da medição com o boletim aberto
      useEffect(() => { setAjustesFolha({}); }, [mesFolha]);
      const [selectedObra, setSelectedObra] = useState('ALL');

      const [movModal, setMovModal] = useState(null);
      const [movForm, setMovForm] = useState({ obraId: '', obraDestinoId: '', materialId: '', qtd: 1, responsavel: '', obs: '' });

      // Os formulários abaixo servem para "novo" e "editar": quando o form tem `id`, é edição.
      const [novoMatModal, setNovoMatModal] = useState(false);
      const [novoMatForm, setNovoMatForm] = useState({});

      const [novaObraModal, setNovaObraModal] = useState(false);
      const [novaObraForm, setNovaObraForm] = useState({});

      const [novaCompraModal, setNovaCompraModal] = useState(false);
      const [novaCompraForm, setNovaCompraForm] = useState({});

      const [novaDespesaModal, setNovaDespesaModal] = useState(false);
      const [novaDespesaForm, setNovaDespesaForm] = useState({});

      const [novoFuncModal, setNovoFuncModal] = useState(false);
      const [novoFuncForm, setNovoFuncForm] = useState({});

      const [fornModal, setFornModal] = useState(false);
      const [fornForm, setFornForm] = useState({});

      const perm = user ? PERMISSOES[user.perfil] : null;
      const can = (acao) => !!perm && (perm.acoes.includes('*') || perm.acoes.includes(acao));
      const podeVerAba = (aba) => !!perm && perm.abas.includes(aba);

      // ---------- Sessão ----------
      const abrirSessao = async (session) => {
        if (!session) { setUser(null); setData(DADOS_VAZIOS); return; }
        const { data: p, error } = await sb.from('perfis').select('*').eq('id', session.user.id).maybeSingle();
        if (error || !p) { setLoginErro('Usuário sem perfil cadastrado. Fale com o Engenheiro responsável.'); await sb.auth.signOut(); return; }
        if (!p.ativo) { setLoginErro('Seu acesso ainda não foi liberado (ou foi desativado). Fale com o Engenheiro responsável.'); await sb.auth.signOut(); return; }
        setUser(prev => {
          if (!prev || prev.id !== p.id) setActiveTab(PERMISSOES[p.perfil].abaInicial);
          return { id: p.id, email: p.email, nome: p.nome, perfil: p.perfil };
        });
      };

      useEffect(() => {
        if (!sb) { setCarregandoSessao(false); return; }
        sb.auth.getSession().then(({ data: { session } }) => abrirSessao(session).finally(() => setCarregandoSessao(false)));
        const { data: { subscription } } = sb.auth.onAuthStateChange((evento, session) => {
          if (evento === 'SIGNED_OUT') { setUser(null); setData(DADOS_VAZIOS); }
          if (evento === 'SIGNED_IN') abrirSessao(session);
        });
        return () => subscription.unsubscribe();
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setEnviando(true); setLoginErro('');
        const { error } = await sb.auth.signInWithPassword({ email: loginEmail.trim(), password: loginSenha });
        setEnviando(false);
        if (error) return setLoginErro(/invalid/i.test(error.message) ? 'E-mail ou senha inválidos.' : error.message);
        setLoginSenha('');
      };

      const handleCadastro = async (e) => {
        e.preventDefault();
        setEnviando(true); setLoginErro(''); setLoginInfo('');
        const { data: res, error } = await sb.auth.signUp({
          email: loginEmail.trim(), password: loginSenha,
          options: { data: { nome: cadastroNome.trim() }, emailRedirectTo: window.location.href.split('#')[0] }
        });
        setEnviando(false);
        if (error) return setLoginErro(error.message);
        setModoCadastro(false); setLoginSenha('');
        setLoginInfo(res.session
          ? 'Conta criada.'
          : 'Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre aqui.');
      };

      const handleEsqueciSenha = async () => {
        if (!loginEmail.trim()) return setLoginErro('Digite seu e-mail acima e clique novamente em "Esqueci a senha".');
        const { error } = await sb.auth.resetPasswordForEmail(loginEmail.trim(), { redirectTo: window.location.href.split('#')[0] });
        if (error) return setLoginErro(error.message);
        alert('Enviamos um link para redefinir a senha no seu e-mail.');
      };

      const sair = () => sb.auth.signOut();

      // ---------- Leitura + tempo real ----------
      const recarregar = useCallback(async () => {
        if (!user) return;
        try {
          setData(await carregarDados(user.perfil, mesPresenca, mesFolha, diarioDia));
          setSincronizado(new Date());
          setErroConexao('');
        } catch (err) {
          setErroConexao('Não foi possível ler os dados do servidor: ' + err.message);
        }
      }, [user?.id, user?.perfil, mesPresenca, mesFolha, diarioDia]);

      useEffect(() => {
        if (!user) return;
        recarregar();
        let timer = null;
        const agendar = () => { clearTimeout(timer); timer = setTimeout(recarregar, 400); };
        const canal = sb.channel('sigo-mudancas')
          .on('postgres_changes', { event: '*', schema: 'public' }, agendar)
          .subscribe();
        const aoVoltar = () => { if (document.visibilityState === 'visible') recarregar(); };
        document.addEventListener('visibilitychange', aoVoltar);
        return () => { clearTimeout(timer); sb.removeChannel(canal); document.removeEventListener('visibilitychange', aoVoltar); };
      }, [recarregar]);

      // Executa uma gravação, mostra erro se houver e recarrega os dados
      const executar = async (fn) => {
        setEnviando(true);
        try { await fn(); await recarregar(); return true; }
        catch (err) { alert(err.message); return false; }
        finally { setEnviando(false); }
      };

      const primeiraObra = () => (selectedObra !== 'ALL' ? selectedObra : data.obras[0]?.id) || '';

      // ---------- Abertura de formulários (novo / editar) ----------
      const abrirMaterial = (mat) => {
        setNovoMatForm(mat ? { id: mat.id, codigo: mat.codigo, nome: mat.nome, categoria: mat.categoria, unidade: mat.unidade, min: mat.min }
                           : { codigo: proximoCodigo(data.materiais), nome: '', categoria: filtroCategoria || 'Geral', unidade: 'un', min: 10 });
        setNovoMatModal(true);
      };
      const abrirObra = (obra) => {
        setNovaObraForm(obra ? { ...obra } : { nome: '', endereco: '', responsavel: '', inicio: hojeISO(), previsao: somaDias(365), orcamento: '', status: 'Em andamento' });
        setNovaObraModal(true);
      };
      const abrirCompra = (compra, materialId) => {
        if (!compra && (!data.obras.length || !data.materiais.length)) return alert('Cadastre ao menos uma obra e um material antes.');
        setNovaCompraForm(compra ? { ...compra } : {
          obraId: primeiraObra(), materialId: materialId || data.materiais[0]?.id || '',
          fornecedorId: data.fornecedores[0]?.id || '', qtd: '', precoUnit: '', entrega: somaDias(7)
        });
        setNovaCompraModal(true);
      };
      const abrirDespesa = (desp) => {
        if (!desp && !data.obras.length) return alert('Cadastre ao menos uma obra antes.');
        setNovaDespesaForm(desp ? { ...desp } : { obraId: primeiraObra(), descricao: '', categoria: 'Material', valor: '', vencimento: somaDias(15), status: 'A pagar' });
        setNovaDespesaModal(true);
      };
      const abrirFuncionario = (func) => {
        if (!func && !data.obras.length) return alert('Cadastre ao menos uma obra antes.');
        const rem = func ? data.remuneracoes[func.id] : null;
        setNovoFuncForm(func ? { ...func, tipoPag: rem?.tipo || 'Diária', valorPag: rem?.valor ?? '' }
                             : { nome: '', funcao: 'Pedreiro', obraId: primeiraObra(), tipoPag: 'Diária', valorPag: '' });
        setNovoFuncModal(true);
      };
      const abrirFornecedor = (forn) => {
        setFornForm(forn ? { ...forn } : { nome: '', contato: '', categoria: '' });
        setFornModal(true);
      };
      const abrirMov = (tipo) => {
        if (!data.obras.length || !data.materiais.length) return alert('Cadastre ao menos uma obra e um material antes.');
        const origem = tipo === 'Transferência' ? (data.obras[0]?.id || '') : primeiraObra();
        const destino = data.obras.find(o => o.id !== origem)?.id || origem;
        setMovForm({
          obraId: origem, obraDestinoId: destino,
          materialId: data.materiais.some(m => m.id === movForm.materialId) ? movForm.materialId : (data.materiais[0]?.id || ''),
          qtd: '', responsavel: tipo === 'Saída' ? '' : user.nome, obs: ''
        });
        setMovModal(tipo);
      };

      // ---------- Gravações ----------
      const salvarMaterial = async (e) => {
        e.preventDefault();
        const reg = { codigo: novoMatForm.codigo.trim(), nome: novoMatForm.nome.trim(), categoria: (novoMatForm.categoria || '').trim() || 'Geral', unidade: novoMatForm.unidade.trim(), estoque_minimo: Number(novoMatForm.min) };
        if (await executar(async () => ok(novoMatForm.id
          ? await sb.from('materiais').update(reg).eq('id', novoMatForm.id)
          : await sb.from('materiais').insert(reg)))) setNovoMatModal(false);
      };

      const salvarObra = async (e) => {
        e.preventDefault();
        if (novaObraForm.previsao < novaObraForm.inicio) return alert('A previsão de término não pode ser anterior ao início.');
        const { nome, endereco, responsavel, inicio, previsao, status } = novaObraForm;
        const reg = { nome, endereco, responsavel, inicio, previsao, status, orcamento: Number(novaObraForm.orcamento) };
        if (await executar(async () => ok(novaObraForm.id
          ? await sb.from('obras').update(reg).eq('id', novaObraForm.id)
          : await sb.from('obras').insert(reg)))) setNovaObraModal(false);
      };

      const salvarCompra = async (e) => {
        e.preventDefault();
        const qtd = Number(novaCompraForm.qtd), precoUnit = Number(novaCompraForm.precoUnit);
        if (!(qtd > 0) || !(precoUnit >= 0)) return alert('Informe quantidade e preço válidos.');
        const reg = { obra_id: novaCompraForm.obraId, material_id: novaCompraForm.materialId, fornecedor_id: novaCompraForm.fornecedorId || null,
                      qtd, preco_unit: precoUnit, entrega: novaCompraForm.entrega || null };
        if (await executar(async () => ok(novaCompraForm.id
          ? await sb.from('compras').update(reg).eq('id', novaCompraForm.id)
          : await sb.from('compras').insert({ ...reg, status: 'Solicitado', solicitante: user.nome })))) setNovaCompraModal(false);
      };

      const salvarDespesa = async (e) => {
        e.preventDefault();
        const valor = Number(novaDespesaForm.valor);
        if (!(valor > 0)) return alert('Informe um valor maior que zero.');
        const reg = { obra_id: novaDespesaForm.obraId, descricao: novaDespesaForm.descricao.trim(), categoria: novaDespesaForm.categoria,
                      valor, vencimento: novaDespesaForm.vencimento || null, status: novaDespesaForm.status };
        if (await executar(async () => ok(novaDespesaForm.id
          ? await sb.from('despesas').update(reg).eq('id', novaDespesaForm.id)
          : await sb.from('despesas').insert(reg)))) setNovaDespesaModal(false);
      };

      const salvarFuncionario = async (e) => {
        e.preventDefault();
        const reg = { nome: novoFuncForm.nome.trim(), funcao: novoFuncForm.funcao.trim(), obra_id: novoFuncForm.obraId || null };
        const valorPag = novoFuncForm.valorPag === '' ? 0 : Number(novoFuncForm.valorPag);
        if (!(valorPag >= 0)) return alert('Informe um valor de diária ou salário válido.');
        if (await executar(async () => {
          let id = novoFuncForm.id;
          if (id) ok(await sb.from('funcionarios').update(reg).eq('id', id));
          else id = ok(await sb.from('funcionarios').insert(reg).select('id').single()).id;
          if (can('folha.gerir')) {
            ok(await sb.from('remuneracoes').upsert({ funcionario_id: id, tipo: novoFuncForm.tipoPag, valor: valorPag, atualizado_em: new Date().toISOString() }));
          }
        })) setNovoFuncModal(false);
      };

      const salvarFornecedor = async (e) => {
        e.preventDefault();
        const reg = { nome: fornForm.nome.trim(), contato: fornForm.contato.trim(), categoria: fornForm.categoria.trim() };
        if (await executar(async () => ok(fornForm.id
          ? await sb.from('fornecedores').update(reg).eq('id', fornForm.id)
          : await sb.from('fornecedores').insert(reg)))) setFornModal(false);
      };

      const alternarStatusDespesa = (d) => executar(async () =>
        ok(await sb.from('despesas').update({ status: d.status === 'Pago' ? 'A pagar' : 'Pago' }).eq('id', d.id)));

      const marcarPresenca = (f, presenca, dia) => executar(async () =>
        ok(await sb.rpc('marcar_presenca', { p_funcionario: f.id, p_presenca: presenca, p_dia: dia })));

      const alterarPerfilUsuario = (p, campos) => {
        if (p.id === user.id && (campos.perfil && campos.perfil !== 'Engenheiro' || campos.ativo === false)) {
          return alert('Você não pode retirar o seu próprio acesso de Engenheiro.');
        }
        return executar(async () => ok(await sb.from('perfis').update(campos).eq('id', p.id)));
      };

      // ---------- Diário de obra ----------
      const obraDiarioId = (selectedObra !== 'ALL' ? selectedObra : diarioObra) || data.obras.find(o => o.status === 'Em andamento')?.id || data.obras[0]?.id || '';
      const diarioAtual = data.diarios.find(d => d.obra_id === obraDiarioId && d.dia === diarioDia) || null;
      useEffect(() => { setDiarioForm(null); }, [obraDiarioId, diarioDia]);
      // URLs temporárias (1 h) das fotos do diário aberto
      useEffect(() => {
        const faltam = (diarioAtual?.fotos || []).map(f => f.caminho).filter(c => !fotoUrls[c]);
        if (!faltam.length || !sb?.storage) return;
        sb.storage.from('diario').createSignedUrls(faltam, 3600).then(({ data: urls }) => {
          if (urls) setFotoUrls(prev => { const n = { ...prev }; urls.forEach(u => { if (u.signedUrl) n[u.path] = u.signedUrl; }); return n; });
        });
      }, [diarioAtual?.id, diarioAtual?.fotos?.length]);

      const formDiario = diarioForm || {
        clima_manha: diarioAtual?.clima_manha || 'Bom', clima_tarde: diarioAtual?.clima_tarde || 'Bom',
        servicos: diarioAtual?.servicos || '', ocorrencias: diarioAtual?.ocorrencias || '', observacoes: diarioAtual?.observacoes || ''
      };
      const editarDiario = (campo, valor) => setDiarioForm({ ...formDiario, [campo]: valor });

      const garantirDiario = async () => {
        const reg = { ...formDiario, atualizado_em: new Date().toISOString() };
        if (diarioAtual) { ok(await sb.from('diarios').update(reg).eq('id', diarioAtual.id)); return diarioAtual.id; }
        return ok(await sb.from('diarios').insert({ ...reg, obra_id: obraDiarioId, dia: diarioDia, autor_nome: user.nome }).select('id').single()).id;
      };
      const salvarDiario = async () => {
        if (!obraDiarioId) return alert('Cadastre uma obra antes.');
        if (await executar(garantirDiario)) setDiarioForm(null);
      };
      const enviarFotos = async (files) => {
        const lista = Array.from(files || []).filter(f => f.type.startsWith('image/'));
        if (!lista.length) return;
        setEnviandoFotos(lista.length);
        await executar(async () => {
          const id = await garantirDiario();
          for (const f of lista) {
            const blob = await comprimirImagem(f);
            const caminho = `${obraDiarioId}/${diarioDia}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
            const up = await sb.storage.from('diario').upload(caminho, blob, { contentType: 'image/jpeg' });
            if (up.error) throw new Error('Falha ao enviar a foto: ' + up.error.message);
            ok(await sb.from('diario_fotos').insert({ diario_id: id, caminho }));
            setEnviandoFotos(n => n - 1);
          }
        });
        setDiarioForm(null); setEnviandoFotos(0);
      };
      const legendarFoto = (foto, legenda) => executar(async () => ok(await sb.from('diario_fotos').update({ legenda }).eq('id', foto.id)));
      const apagarFoto = (foto) => {
        if (!confirm('Apagar esta foto do diário?')) return;
        executar(async () => {
          await sb.storage.from('diario').remove([foto.caminho]);
          ok(await sb.from('diario_fotos').delete().eq('id', foto.id));
        });
      };

      // ---------- Documentos ----------
      const docsAlerta = data.documentos.filter(d => ['Vencido', 'Vence em breve'].includes(situacaoDoc(d)));
      const abrirDocumento = (doc) => {
        setDocArquivo(null);
        setDocForm(doc ? { ...doc, vinculo: doc.funcionario_id ? 'func' : 'empresa' }
                       : { vinculo: 'func', funcionario_id: data.funcionarios[0]?.id || '', empresa: '', tipo: TIPOS_DOC[0], descricao: '', emissao: hojeISO(), validade: '' });
        setDocModal(true);
      };
      const salvarDocumento = async (e) => {
        e.preventDefault();
        const f = docForm;
        if (f.vinculo === 'func' && !f.funcionario_id) return alert('Escolha o funcionário.');
        if (f.vinculo === 'empresa' && !f.empresa.trim()) return alert('Informe a empresa.');
        if (f.emissao && f.validade && f.validade < f.emissao) return alert('A validade não pode ser anterior à emissão.');
        if (docArquivo && docArquivo.size > 10 * 1024 * 1024) return alert('O arquivo passa de 10 MB.');
        if (await executar(async () => {
          let arquivo = f.arquivo || null;
          if (docArquivo) {
            const ext = (docArquivo.name.split('.').pop() || 'pdf').toLowerCase();
            const caminho = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
            const corpo = docArquivo.type.startsWith('image/') ? await comprimirImagem(docArquivo) : docArquivo;
            const up = await sb.storage.from('documentos').upload(caminho, corpo, { contentType: docArquivo.type.startsWith('image/') ? 'image/jpeg' : docArquivo.type });
            if (up.error) throw new Error('Falha ao enviar o arquivo: ' + up.error.message);
            if (f.arquivo) await sb.storage.from('documentos').remove([f.arquivo]);
            arquivo = caminho;
          }
          const reg = { funcionario_id: f.vinculo === 'func' ? f.funcionario_id : null, empresa: f.vinculo === 'empresa' ? f.empresa.trim() : '',
                        tipo: f.tipo, descricao: (f.descricao || '').trim(), emissao: f.emissao || null, validade: f.validade || null, arquivo };
          ok(f.id ? await sb.from('documentos').update(reg).eq('id', f.id) : await sb.from('documentos').insert(reg));
        })) setDocModal(false);
      };
      const excluirDocumento = (doc) => {
        if (!confirm(`Excluir o documento "${doc.tipo}"${doc.arquivo ? ' e o arquivo anexado' : ''}?`)) return;
        executar(async () => {
          if (doc.arquivo) await sb.storage.from('documentos').remove([doc.arquivo]);
          ok(await sb.from('documentos').delete().eq('id', doc.id));
        });
      };
      const abrirArquivoDoc = async (doc) => {
        const janela = window.open('', '_blank');
        const { data: u, error } = await sb.storage.from('documentos').createSignedUrl(doc.arquivo, 600);
        if (error || !u?.signedUrl) { janela && janela.close(); return alert('Não foi possível abrir o arquivo.'); }
        if (janela) janela.location.href = u.signedUrl; else window.location.href = u.signedUrl;
      };

      // ---------- Medição de empreiteiro ----------
      const medRascunhos = data.medicoes.filter(m => m.status === 'Rascunho').length;
      const itensDoContrato = (cid) => data.contratoItens.filter(i => i.contrato_id === cid);
      const valorContrato = (cid) => itensDoContrato(cid).reduce((s, i) => s + Math.round(i.qtd * i.preco_unit * 100) / 100, 0);
      // quantidade já medida de um item: aprovadas (e, se informado, só as de número menor)
      const medidoAte = (itemId, ateNumero) => data.medicaoItens.reduce((s, mi) => {
        if (mi.item_id !== itemId) return s;
        const m = data.medicoes.find(x => x.id === mi.medicao_id);
        if (!m || m.status !== 'Aprovada' || (ateNumero !== undefined && m.numero >= ateNumero)) return s;
        return s + mi.qtd;
      }, 0);
      const abrirContrato = (c) => {
        setContratoForm(c ? { id: c.id, obraId: c.obra_id, empreiteiro: c.empreiteiro, objeto: c.objeto, retencao: c.retencao_pct, status: c.status,
            itens: itensDoContrato(c.id).map(i => ({ id: i.id, descricao: i.descricao, unidade: i.unidade, qtd: i.qtd, preco: i.preco_unit })) }
          : { obraId: primeiraObra(), empreiteiro: '', objeto: '', retencao: 5, status: 'Ativo', itens: [{ descricao: '', unidade: 'm²', qtd: '', preco: '' }] });
        setContratoModal(true);
      };
      const salvarContrato = async (e) => {
        e.preventDefault();
        const f = contratoForm;
        const itens = f.itens.filter(i => i.descricao.trim());
        if (!f.empreiteiro.trim()) return alert('Informe o empreiteiro.');
        if (!itens.length) return alert('Inclua pelo menos um item no contrato.');
        if (itens.some(i => !(Number(i.qtd) > 0) || !(Number(i.preco) >= 0) || i.preco === '')) return alert('Cada item precisa de quantidade e preço unitário.');
        const ret = Number(f.retencao) || 0;
        if (ret < 0 || ret > 100) return alert('A retenção deve ficar entre 0 e 100%.');
        const okSalvo = await executar(async () => {
          const reg = { obra_id: f.obraId, empreiteiro: f.empreiteiro.trim(), objeto: (f.objeto || '').trim(), retencao_pct: ret, status: f.status };
          let id = f.id;
          if (id) ok(await sb.from('contratos').update(reg).eq('id', id));
          else id = ok(await sb.from('contratos').insert(reg).select().single()).id;
          const antigos = itensDoContrato(id);
          for (const a of antigos) if (!itens.some(i => i.id === a.id)) {
            const r = await sb.from('contrato_itens').delete().eq('id', a.id);
            if (r.error) throw new Error(`O item "${a.descricao}" já foi medido e não pode ser removido.`);
          }
          for (const [k, i] of itens.entries()) {
            const row = { descricao: i.descricao.trim(), unidade: i.unidade || 'un', qtd: Number(i.qtd), preco_unit: Number(i.preco), ordem: k + 1 };
            if (i.id) ok(await sb.from('contrato_itens').update(row).eq('id', i.id));
            else ok(await sb.from('contrato_itens').insert({ ...row, contrato_id: id }));
          }
          setContratoSel(id);
        });
        if (okSalvo) setContratoModal(false);
      };
      const abrirMedicao = (c, m) => {
        const itens = itensDoContrato(c.id);
        if (m) {
          setMedForm({ id: m.id, contratoId: c.id, numero: m.numero, ini: m.periodo_ini, fim: m.periodo_fim, obs: m.obs || '',
            qtds: Object.fromEntries(itens.map(i => [i.id, String(data.medicaoItens.find(x => x.medicao_id === m.id && x.item_id === i.id)?.qtd ?? '')])) });
        } else {
          const doContrato = data.medicoes.filter(x => x.contrato_id === c.id);
          if (doContrato.some(x => x.status === 'Rascunho')) return alert('Já existe uma medição em rascunho neste contrato. Aprove ou exclua antes de abrir outra.');
          const ult = doContrato[doContrato.length - 1];
          const ini = ult ? somaDiasDe(ult.periodo_fim, 1) : hojeISO().slice(0, 8) + '01';
          setMedForm({ contratoId: c.id, numero: (ult?.numero || 0) + 1, ini, fim: hojeISO() >= ini ? hojeISO() : ini, obs: '', qtds: {} });
        }
        setMedModal(true);
      };
      const salvarMedicao = async (e) => {
        e.preventDefault();
        const f = medForm;
        if (f.fim < f.ini) return alert('O fim do período não pode ser antes do início.');
        const itens = itensDoContrato(f.contratoId);
        for (const i of itens) {
          const q = Number(f.qtds[i.id] || 0);
          if (q < 0) return alert('Quantidade não pode ser negativa.');
          if (medidoAte(i.id, f.numero) + q > i.qtd + 1e-9) return alert(`"${i.descricao}": a quantidade acumulada passaria do contratado (${i.qtd} ${i.unidade}).`);
        }
        const okSalvo = await executar(async () => {
          const reg = { periodo_ini: f.ini, periodo_fim: f.fim, obs: (f.obs || '').trim() };
          let id = f.id;
          if (id) ok(await sb.from('medicoes').update(reg).eq('id', id));
          else id = ok(await sb.from('medicoes').insert({ ...reg, contrato_id: f.contratoId, numero: f.numero }).select().single()).id;
          ok(await sb.from('medicao_itens').delete().eq('medicao_id', id));
          const linhas = itens.map(i => ({ medicao_id: id, item_id: i.id, qtd: Number(f.qtds[i.id] || 0) })).filter(l => l.qtd > 0);
          if (linhas.length) ok(await sb.from('medicao_itens').insert(linhas));
        });
        if (okSalvo) setMedModal(false);
      };
      const aprovarMedicao = (m, c) => {
        const bruto = data.medicaoItens.filter(x => x.medicao_id === m.id).reduce((s, x) => s + Math.round(x.qtd * (data.contratoItens.find(i => i.id === x.item_id)?.preco_unit || 0) * 100) / 100, 0);
        const ret = Math.round(bruto * c.retencao_pct) / 100;
        if (!confirm(`Aprovar a medição nº ${m.numero}?\n\nValor medido: ${formatBRL(bruto)}\nRetenção (${c.retencao_pct}%): ${formatBRL(ret)}\nA pagar: ${formatBRL(bruto - ret)}\n\nSerá lançada uma despesa "Mão de Obra" (A pagar) no Financeiro, com vencimento 10 dias após o fim do período.`)) return;
        executar(async () => ok(await sb.rpc('aprovar_medicao', { p_id: m.id })));
      };
      const reabrirMedicao = (m) => {
        if (!confirm(`Reabrir a medição nº ${m.numero}? A despesa lançada no Financeiro será excluída e a medição volta a ser rascunho.`)) return;
        executar(async () => ok(await sb.rpc('reabrir_medicao', { p_id: m.id })));
      };
      const excluirMedicao = (m) => {
        if (!confirm(`Excluir o rascunho da medição nº ${m.numero}?`)) return;
        executar(async () => ok(await sb.from('medicoes').delete().eq('id', m.id)));
      };
      const excluirContrato = (c) => {
        if (data.medicoes.some(m => m.contrato_id === c.id)) return alert('Este contrato já tem medições. Para tirá-lo da lista, marque-o como Encerrado.');
        if (!confirm(`Excluir o contrato de ${c.empreiteiro}?`)) return;
        executar(async () => { ok(await sb.from('contratos').delete().eq('id', c.id)); setContratoSel(''); });
      };

      // ---------- EPI ----------
      const TROCA_AVISO = 15;
      const episTroca = data.epis.filter(e => e.troca_prevista && diasAte(e.troca_prevista) <= TROCA_AVISO &&
        !data.epis.some(o => o.funcionario_id === e.funcionario_id && o.material_id === e.material_id && (o.dia > e.dia || (o.dia === e.dia && o.criado_em > e.criado_em))));
      const ehEpi = (m) => /epi|segurança|seguranca/i.test(m.categoria) || /capacete|luva|bota|óculos|oculos|protetor|cinto|máscara|mascara|colete|botina|abafador|respirador/i.test(m.nome);
      const abrirEntregaEpi = (funcId, materialId) => {
        if (!data.funcionarios.length) return alert('Cadastre os funcionários antes.');
        const f = data.funcionarios.find(x => x.id === funcId) || data.funcionarios[0];
        const mats = [...data.materiais].sort((a, b) => ehEpi(b) - ehEpi(a));
        setEpiForm({ funcionarioId: f.id, obraId: f.obraId || primeiraObra(), materialId: materialId || mats[0]?.id || '', qtd: 1, ca: '', troca: somaDias(90) });
        setEpiModal(true);
      };
      const salvarEntregaEpi = async (e) => {
        e.preventDefault();
        const qtd = Number(epiForm.qtd);
        if (!(qtd > 0)) return alert('Informe a quantidade.');
        const saldo = getMat(epiForm.materialId)?.estoques[epiForm.obraId] || 0;
        if (qtd > saldo) return alert(`Saldo insuficiente na obra (disponível: ${saldo}).`);
        if (await executar(async () => ok(await sb.rpc('entregar_epi', {
          p_funcionario: epiForm.funcionarioId, p_material: epiForm.materialId, p_obra: epiForm.obraId,
          p_qtd: qtd, p_ca: (epiForm.ca || '').trim(), p_troca: epiForm.troca || null })))) setEpiModal(false);
      };
      const cancelarEntregaEpi = (ent) => {
        if (!confirm('Cancelar esta entrega de EPI? O material volta para o estoque da obra.')) return;
        executar(async () => ok(await sb.rpc('cancelar_entrega_epi', { p_id: ent.id })));
      };

      // ---------- Folha de pagamento ----------
      const fecharFolha = (itens) => {
        const total = itens.reduce((s, i) => s + i.total, 0);
        if (!confirm(`Fechar a folha de ${rotuloMes(mesFolha)} no total de ${formatBRL(total)}?\n\nSerá lançada uma despesa "Mão de Obra" (A pagar) para cada obra, com vencimento no dia 5 do mês seguinte.`)) return;
        const aj = {};
        Object.entries(ajustesFolha).forEach(([fid, a]) => { const v = Number(a.valor); if (v) aj[fid] = { valor: v, obs: a.obs || '' }; });
        executar(async () => ok(await sb.rpc('fechar_folha', { p_mes: mesFolha, p_ajustes: aj })));
      };
      const reabrirFolha = () => {
        if (!confirm(`Reabrir a folha de ${rotuloMes(mesFolha)}?\n\nAs despesas lançadas por ela serão apagadas do Financeiro, e você poderá fechar de novo.`)) return;
        executar(async () => ok(await sb.rpc('reabrir_folha', { p_mes: mesFolha })));
      };

      // ---------- Exclusões (com bloqueio quando há vínculos) ----------
      const excluirObra = (obra) => {
        const temEstoque = data.materiais.some(m => (m.estoques[obra.id] || 0) > 0);
        const temVinculo = data.movimentacoes.some(m => m.obraId === obra.id || m.obraDestinoId === obra.id)
          || data.compras.some(c => c.obraId === obra.id) || data.despesas.some(d => d.obraId === obra.id)
          || data.funcionarios.some(f => f.obraId === obra.id);
        if (temEstoque || temVinculo) {
          return alert('Esta obra já tem estoque, movimentações, compras, despesas ou funcionários vinculados e não pode ser excluída.\n\nUse "Editar" e altere o status para "Concluída" ou "Paralisada".');
        }
        if (!confirm(`Excluir a obra "${obra.nome}"?`)) return;
        if (selectedObra === obra.id) setSelectedObra('ALL');
        executar(async () => ok(await sb.from('obras').delete().eq('id', obra.id)));
      };

      const excluirMaterial = (mat) => {
        const saldo = Object.values(mat.estoques).reduce((s, v) => s + Number(v || 0), 0);
        const temVinculo = data.movimentacoes.some(m => m.materialId === mat.id) || data.compras.some(c => c.materialId === mat.id);
        if (saldo > 0 || temVinculo) {
          return alert('Este material tem saldo em estoque ou histórico de movimentações/compras e não pode ser excluído. Você pode editar o nome, a unidade ou o mínimo.');
        }
        if (!confirm(`Excluir o material "${mat.nome}"?`)) return;
        executar(async () => ok(await sb.from('materiais').delete().eq('id', mat.id)));
      };

      const excluirFornecedor = (forn) => {
        if (data.compras.some(c => c.fornecedorId === forn.id)) return alert('Este fornecedor tem compras registradas e não pode ser excluído.');
        if (!confirm(`Excluir o fornecedor "${forn.nome}"?`)) return;
        executar(async () => ok(await sb.from('fornecedores').delete().eq('id', forn.id)));
      };

      const cancelarCompra = (compra) => {
        if (!confirm('Cancelar esta solicitação de compra?')) return;
        executar(async () => ok(await sb.from('compras').update({ status: 'Cancelado' }).eq('id', compra.id)));
      };

      const excluirDespesa = (desp) => {
        if (!confirm(`Excluir a despesa "${desp.descricao}" (${formatBRL(desp.valor)})?`)) return;
        executar(async () => ok(await sb.from('despesas').delete().eq('id', desp.id)));
      };

      const excluirFuncionario = (func) => {
        if (!confirm(`Excluir o funcionário "${func.nome}"?`)) return;
        executar(async () => ok(await sb.from('funcionarios').delete().eq('id', func.id)));
      };

      // ---------- Estoque: tudo pelas funções do banco (transação única, saldo validado no servidor) ----------
      const getObraNome = (id) => data.obras.find(o => o.id === id)?.nome || 'Obra';
      const getMat = (id) => data.materiais.find(m => m.id === id);

      const estornarMov = (mv) => {
        const mat = getMat(mv.materialId);
        if (!confirm(`Estornar esta ${mv.tipo.toLowerCase()} de ${mv.qtd} ${mat?.unidade || ''} de ${mat?.nome || 'material'}?\n\nO registro original será mantido e um lançamento de estorno será criado.`)) return;
        executar(async () => ok(await sb.rpc('estornar_movimentacao', { p_id: mv.id })));
      };

      const alertasEstoque = useMemo(() => {
        const list = [];
        data.materiais.forEach(mat => {
          data.obras.forEach(obra => {
            if (obra.status === 'Concluída') return;
            if (selectedObra !== 'ALL' && selectedObra !== obra.id) return;
            const saldo = mat.estoques[obra.id] || 0;
            if (saldo <= mat.min) list.push({ mat, obra, saldo });
          });
        });
        return list;
      }, [data.materiais, data.obras, selectedObra]);

      const handleSaveMov = async (e) => {
        e.preventDefault();
        if (!can('mov.' + movModal)) return alert('Seu perfil não tem permissão para esta operação.');
        const qtd = Number(movForm.qtd);
        if (!(qtd > 0) || !movForm.responsavel.trim()) return alert('Informe a quantidade e o responsável.');
        if (movModal === 'Transferência' && movForm.obraId === movForm.obraDestinoId) {
          return alert('A obra de destino deve ser diferente da obra de origem.');
        }
        const mat = getMat(movForm.materialId);
        const saldoAtual = mat?.estoques[movForm.obraId] || 0;
        if ((movModal === 'Saída' || movModal === 'Transferência') && qtd > saldoAtual) {
          return alert(`Saldo insuficiente na obra selecionada (Disponível: ${saldoAtual} ${mat?.unidade}).`);
        }
        const okGravou = await executar(async () => ok(await sb.rpc('registrar_movimentacao', {
          p_tipo: movModal, p_obra: movForm.obraId,
          p_obra_destino: movModal === 'Transferência' ? movForm.obraDestinoId : null,
          p_material: movForm.materialId, p_qtd: qtd, p_responsavel: movForm.responsavel, p_obs: movForm.obs || '-'
        })));
        if (okGravou) setMovModal(null);
      };

      const handleConfirmarEntregaCompra = (compra) => {
        if (!can('compra.receber')) return alert('Seu perfil não tem permissão para receber compras.');
        if (!confirm('Confirmar o recebimento desta compra? O material entrará no estoque e a despesa será lançada.')) return;
        executar(async () => ok(await sb.rpc('receber_compra', { p_id: compra.id })));
      };

      if (!SUPABASE_CONFIGURADO) {
        return (
          <Moldura>
            <h2 className="font-extrabold text-slate-900">Configuração pendente</h2>
            <p className="text-sm text-slate-600">
              Abra o arquivo <code className="bg-slate-100 px-1 rounded">index.html</code> e preencha
              <code className="bg-slate-100 px-1 rounded">SUPABASE_URL</code> e
              <code className="bg-slate-100 px-1 rounded">SUPABASE_ANON_KEY</code> com os dados do seu projeto
              (Supabase → Project Settings → API). O passo a passo está no README.
            </p>
          </Moldura>
        );
      }

      if (carregandoSessao) {
        return <Moldura><p className="text-sm text-slate-500 text-center">Carregando…</p></Moldura>;
      }

      if (!user) {
        return (
          <Moldura>
            <h2 className="font-extrabold text-slate-900">{modoCadastro ? 'Criar conta' : 'Entrar'}</h2>
            <form onSubmit={modoCadastro ? handleCadastro : handleLogin} className="space-y-4">
              {modoCadastro && (
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Nome</label>
                  <input type="text" value={cadastroNome} onChange={e => setCadastroNome(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" required />
                </div>
              )}
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">E-mail</label>
                <input type="email" autoComplete="username" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" required />
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Senha</label>
                <input type="password" autoComplete={modoCadastro ? 'new-password' : 'current-password'} minLength={modoCadastro ? 8 : undefined} value={loginSenha} onChange={e => setLoginSenha(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" required />
              </div>
              {loginErro && <p className="text-sm font-semibold text-red-600">{loginErro}</p>}
              {loginInfo && <p className="text-sm font-semibold text-emerald-700">{loginInfo}</p>}
              <button type="submit" disabled={enviando} className="w-full bg-slate-900 hover:bg-slate-800 disabled:opacity-50 text-white font-bold py-2.5 rounded-lg transition">
                {enviando ? 'Aguarde…' : modoCadastro ? 'Criar conta' : 'Entrar no Sistema'}
              </button>
            </form>
            <div className="pt-4 border-t border-slate-100 flex justify-between text-xs font-bold">
              <button type="button" onClick={() => { setModoCadastro(!modoCadastro); setLoginErro(''); setLoginInfo(''); }} className="text-slate-700 hover:underline">
                {modoCadastro ? 'Já tenho conta' : 'Criar conta'}
              </button>
              {!modoCadastro && <button type="button" onClick={handleEsqueciSenha} className="text-slate-500 hover:underline">Esqueci a senha</button>}
            </div>
            {modoCadastro && <p className="text-xs text-slate-500">Novas contas ficam aguardando liberação do Engenheiro responsável.</p>}
          </Moldura>
        );
      }

      const menuItems = [
        { id: 'materiais', label: 'Controle de Materiais', icon: 'package', badge: alertasEstoque.length || null },
        { id: 'dashboard', label: 'Painel Principal', icon: 'dashboard' },
        { id: 'obras', label: 'Cadastro de Obras', icon: 'building' },
        { id: 'diario', label: 'Diário de Obra', icon: 'book' },
        { id: 'compras', label: 'Compras & Fornecedores', icon: 'cart' },
        { id: 'financeiro', label: 'Controle Financeiro', icon: 'dollar' },
        { id: 'medicoes', label: 'Medições', icon: 'ruler', badge: medRascunhos || null },
        { id: 'funcionarios', label: 'Funcionários', icon: 'users' },
        { id: 'epi', label: 'Controle de EPI', icon: 'shield', badge: episTroca.length || null },
        { id: 'documentos', label: 'Documentos', icon: 'file', badge: docsAlerta.length || null },
        { id: 'folha', label: 'Folha de Pagamento', icon: 'wallet' },
        { id: 'relatorios', label: 'Relatórios', icon: 'file' },
        { id: 'usuarios', label: 'Usuários', icon: 'users', badge: data.perfis.filter(p => !p.ativo).length || null },
      ].filter(item => podeVerAba(item.id));

      // Garante que o perfil só veja abas permitidas
      const aba = podeVerAba(activeTab) ? activeTab : perm.abaInicial;

      const obrasVisiveis = selectedObra === 'ALL' ? data.obras : data.obras.filter(o => o.id === selectedObra);
      const movsVisiveis = selectedObra === 'ALL' ? data.movimentacoes : data.movimentacoes.filter(m => m.obraId === selectedObra || m.obraDestinoId === selectedObra);
      const comprasVisiveis = selectedObra === 'ALL' ? data.compras : data.compras.filter(c => c.obraId === selectedObra);
      const despesasVisiveis = selectedObra === 'ALL' ? data.despesas : data.despesas.filter(d => d.obraId === selectedObra);
      const funcsVisiveis = selectedObra === 'ALL' ? data.funcionarios : data.funcionarios.filter(f => f.obraId === selectedObra);

      const ordenarPt = (a, b) => a.localeCompare(b, 'pt-BR');
      const categoriasEmUso = [...new Set(data.materiais.map(m => m.categoria))].sort(ordenarPt);
      const categoriasMateriais = [...new Set([...CATEGORIAS_PADRAO, ...categoriasEmUso])].sort(ordenarPt);
      const termoBusca = semAcento(buscaEstoque.trim());
      const materiaisFiltrados = data.materiais.filter(m =>
        (!filtroCategoria || m.categoria === filtroCategoria) &&
        (!termoBusca || semAcento(`${m.codigo} ${m.nome} ${m.categoria}`).includes(termoBusca)));

      // Presença: mapa "funcionario|dia" -> status, para o mês carregado
      const presencaMap = {};
      data.presencas.forEach(p => { presencaMap[p.funcionarioId + '|' + p.dia] = p.status; });
      const hoje = hojeISO();
      const nDiasMes = diasDoMes(mesPresenca);
      const diasMes = Array.from({ length: nDiasMes }, (_, i) => mesPresenca + '-' + pad2(i + 1));
      const resumoPresenca = (fid) => {
        const r = { Presente: 0, Falta: 0, Atestado: 0 };
        diasMes.forEach(d => { const st = presencaMap[fid + '|' + d]; if (st) r[st]++; });
        return r;
      };
      const mudarMes = (delta) => {
        const [a, m] = mesPresenca.split('-').map(Number);
        const d = new Date(a, m - 1 + delta, 1);
        const novoMes = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
        const novoDia = novoMes === hoje.slice(0, 7) ? hoje : novoMes + '-' + pad2(diasDoMes(novoMes));
        if (novoDia > hoje) return;
        setDiaPresenca(novoDia);
      };

                      </tbody>
                    </table>
                  </div>
                  {m.obs && <p className="text-slate-600">Obs.: {m.obs}</p>}
                  <p className="text-slate-500">Aprovada em {m.aprovada_em ? fmtData(isoLocal(new Date(m.aprovada_em))) : '—'}.</p>
                  <div className="grid grid-cols-2 gap-10 pt-10 text-center text-slate-600">
                    <div className="border-t border-slate-400 pt-1">{ct.empreiteiro}</div>
                    <div className="border-t border-slate-400 pt-1">Engenheiro responsável</div>
                  </div>
                </div>
              </div>
            );
          })()}

          {epiModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 max-h-[95vh] overflow-y-auto">
                <h3 className="text-lg font-extrabold">Registrar entrega de EPI</h3>
                <form onSubmit={salvarEntregaEpi} className="space-y-3 text-sm">
                  <label className="block text-xs font-bold uppercase text-slate-500">Funcionário
                    <select value={epiForm.funcionarioId} onChange={e => { const f = data.funcionarios.find(x => x.id === e.target.value); setEpiForm({ ...epiForm, funcionarioId: e.target.value, obraId: f?.obraId || epiForm.obraId }); }} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900">
                      {data.funcionarios.map(f => <option key={f.id} value={f.id}>{f.nome} — {f.funcao}</option>)}
                    </select>
                  </label>
                  <label className="block text-xs font-bold uppercase text-slate-500">Sai do estoque da obra
                    <select value={epiForm.obraId} onChange={e => setEpiForm({ ...epiForm, obraId: e.target.value })} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900">
                      {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                    </select>
                  </label>
                  <label className="block text-xs font-bold uppercase text-slate-500">EPI
                    <select value={epiForm.materialId} onChange={e => setEpiForm({ ...epiForm, materialId: e.target.value })} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900">
                      {[...data.materiais].sort((a, b) => ehEpi(b) - ehEpi(a)).map(m => <option key={m.id} value={m.id}>{m.nome} (saldo: {m.estoques[epiForm.obraId] || 0} {m.unidade})</option>)}
                    </select>
                  </label>
                  <div className="grid grid-cols-2 gap-2">
                    <label className="text-xs font-bold uppercase text-slate-500">Quantidade
                      <input type="number" min="0.01" step="any" value={epiForm.qtd} onChange={e => setEpiForm({ ...epiForm, qtd: e.target.value })} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900" required />
                    </label>
                    <label className="text-xs font-bold uppercase text-slate-500">Nº do CA
                      <input type="text" value={epiForm.ca} placeholder="Certificado de Aprovação" onChange={e => setEpiForm({ ...epiForm, ca: e.target.value })} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900" />
                    </label>
                  </div>
                  <label className="block text-xs font-bold uppercase text-slate-500">Troca prevista
                    <input type="date" value={epiForm.troca || ''} onChange={e => setEpiForm({ ...epiForm, troca: e.target.value })} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900" />
                    <span className="flex gap-2 mt-1 normal-case font-normal">
                      {[[30, '30 dias'], [90, '3 meses'], [180, '6 meses'], [365, '1 ano']].map(([d, r]) => <button key={d} type="button" onClick={() => setEpiForm({ ...epiForm, troca: somaDias(d) })} className="text-xs text-amber-700 hover:underline">{r}</button>)}
                      <button type="button" onClick={() => setEpiForm({ ...epiForm, troca: '' })} className="text-xs text-slate-500 hover:underline">sem data</button>
                    </span>
                  </label>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setEpiModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" disabled={enviando} className="disabled:opacity-50 px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">Registrar entrega</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {fichaEpi && (() => {
            const f = data.funcionarios.find(x => x.id === fichaEpi);
            const ents = data.epis.filter(e => e.funcionario_id === fichaEpi).slice().reverse();
            const imprimir = () => { document.body.classList.add('imprimindo-ficha'); window.print(); document.body.classList.remove('imprimindo-ficha'); };
            return (
              <div className="ficha-epi fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl max-w-3xl w-full p-8 space-y-5 max-h-[95vh] overflow-y-auto text-sm">
                  <div className="flex justify-between items-start gap-4">
                    <div>
                      <p className="text-xs font-bold uppercase tracking-wider text-slate-500">Ficha de controle de entrega de EPI (NR-6)</p>
                      <h3 className="text-xl font-extrabold text-slate-900 mt-1">{f?.nome}</h3>
                      <p className="text-slate-600">{f?.funcao} · {getObraNome(f?.obraId)}</p>
                    </div>
                    <div className="no-print flex gap-2">
                      <button type="button" onClick={imprimir} className="flex items-center gap-1.5 px-3 py-2 border border-slate-300 rounded-lg text-xs font-bold hover:bg-slate-100"><Icon name="print" className="w-4 h-4" /> Imprimir</button>
                      <button type="button" onClick={() => setFichaEpi(null)} className="px-3 py-2 border border-slate-300 rounded-lg text-xs font-bold">Fechar</button>
                    </div>
                  </div>
                  <table className="w-full text-left border border-slate-300">
                    <thead className="bg-slate-100 text-xs uppercase font-bold"><tr><th className="p-2 border border-slate-300">Data</th><th className="p-2 border border-slate-300">EPI</th><th className="p-2 border border-slate-300">Qtd</th><th className="p-2 border border-slate-300">CA</th><th className="p-2 border border-slate-300">Troca prevista</th><th className="p-2 border border-slate-300 w-44">Assinatura</th></tr></thead>
                    <tbody>
                      {ents.length === 0 && <tr><td colSpan={6} className="p-4 text-center text-slate-400">Nenhuma entrega registrada.</td></tr>}
                      {ents.map(e => { const m = getMat(e.material_id); return (
                        <tr key={e.id}><td className="p-2 border border-slate-300 whitespace-nowrap">{fmtData(e.dia)}</td><td className="p-2 border border-slate-300">{m?.nome}</td><td className="p-2 border border-slate-300">{e.qtd} {m?.unidade}</td><td className="p-2 border border-slate-300">{e.ca || '—'}</td><td className="p-2 border border-slate-300">{fmtData(e.troca_prevista)}</td><td className="p-2 border border-slate-300"></td></tr>
                      ); })}
                    </tbody>
                  </table>
                  <p className="text-xs text-slate-600 leading-relaxed">Declaro ter recebido os Equipamentos de Proteção Individual acima, em perfeito estado, e ter sido orientado(a) sobre o uso correto, a guarda e a conservação, comprometendo-me a usá-los apenas para a finalidade a que se destinam e a comunicar qualquer alteração que os torne impróprios para uso, conforme a NR-6.</p>
                  <div className="grid grid-cols-2 gap-10 pt-10 text-xs text-center text-slate-600">
                    <div className="border-t border-slate-400 pt-1">{f?.nome}</div>
                    <div className="border-t border-slate-400 pt-1">Responsável pela entrega</div>
                  </div>
                </div>
              </div>
            );
          })()}

          {docModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 max-h-[95vh] overflow-y-auto">
                <h3 className="text-lg font-extrabold">{docForm.id ? 'Editar documento' : 'Cadastrar documento'}</h3>
                <form onSubmit={salvarDocumento} className="space-y-3 text-sm">
                  <div className="flex gap-2">
                    {[['func', 'Funcionário'], ['empresa', 'Empresa terceirizada']].map(([v, r]) => (
                      <button key={v} type="button" onClick={() => setDocForm({ ...docForm, vinculo: v })}
                        className={`flex-1 px-3 py-2 rounded-lg border font-bold text-xs ${docForm.vinculo === v ? 'bg-slate-900 text-white border-slate-900' : 'border-slate-300 text-slate-700'}`}>{r}</button>
                    ))}
                  </div>
                  {docForm.vinculo === 'func'
                    ? <select value={docForm.funcionario_id || ''} onChange={e => setDocForm({ ...docForm, funcionario_id: e.target.value })} className="w-full border rounded-lg px-3 py-2" required>
                        {data.funcionarios.map(f => <option key={f.id} value={f.id}>{f.nome} — {f.funcao}</option>)}
                      </select>
                    : <input type="text" placeholder="Nome da empresa" value={docForm.empresa || ''} onChange={e => setDocForm({ ...docForm, empresa: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />}
                  <select value={docForm.tipo} onChange={e => setDocForm({ ...docForm, tipo: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {[...new Set([...TIPOS_DOC, docForm.tipo])].map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                  <input type="text" placeholder="Descrição (opcional, ex.: nº do certificado)" value={docForm.descricao || ''} onChange={e => setDocForm({ ...docForm, descricao: e.target.value })} className="w-full border rounded-lg px-3 py-2" />
                  <div className="grid grid-cols-2 gap-2">
                    <label className="text-xs font-bold uppercase text-slate-500">Emissão
                      <input type="date" value={docForm.emissao || ''} onChange={e => setDocForm({ ...docForm, emissao: e.target.value })} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900" />
                    </label>
                    <label className="text-xs font-bold uppercase text-slate-500">Validade
                      <input type="date" value={docForm.validade || ''} onChange={e => setDocForm({ ...docForm, validade: e.target.value })} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900" />
                    </label>
                  </div>
                  <label className="block text-xs font-bold uppercase text-slate-500">Arquivo (PDF ou foto, até 10 MB)
                    <input type="file" accept="application/pdf,image/*" onChange={e => setDocArquivo(e.target.files[0] || null)} className="w-full mt-1 text-sm font-normal normal-case text-slate-700" />
                    {docForm.arquivo && !docArquivo && <span className="block mt-1 text-xs font-normal normal-case text-emerald-700">Já tem arquivo anexado. Escolha outro só para substituir.</span>}
                  </label>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setDocModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" disabled={enviando} className="disabled:opacity-50 px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {novoFuncModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-extrabold">{novoFuncForm.id ? 'Editar Funcionário' : 'Cadastrar Funcionário'}</h3>
                <form onSubmit={salvarFuncionario} className="space-y-3 text-sm">
                  <input type="text" placeholder="Nome Completo" value={novoFuncForm.nome} onChange={e => setNovoFuncForm({ ...novoFuncForm, nome: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <input type="text" placeholder="Função (ex: Pedreiro, Servente)" value={novoFuncForm.funcao} onChange={e => setNovoFuncForm({ ...novoFuncForm, funcao: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <select value={novoFuncForm.obraId} onChange={e => setNovoFuncForm({ ...novoFuncForm, obraId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                  </select>
                  {can('folha.gerir') && (
                    <div className="grid grid-cols-2 gap-2 pt-1">
                      <label className="text-xs font-bold uppercase text-slate-500">Recebe por
                        <select value={novoFuncForm.tipoPag} onChange={e => setNovoFuncForm({ ...novoFuncForm, tipoPag: e.target.value })} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900">
                          <option value="Diária">Diária</option>
                          <option value="Mensal">Mês (salário)</option>
                        </select>
                      </label>
                      <label className="text-xs font-bold uppercase text-slate-500">{novoFuncForm.tipoPag === 'Mensal' ? 'Salário mensal (R$)' : 'Valor da diária (R$)'}
                        <input type="number" min="0" step="0.01" value={novoFuncForm.valorPag} onChange={e => setNovoFuncForm({ ...novoFuncForm, valorPag: e.target.value })} placeholder="0,00" className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900" />
                      </label>
                    </div>
                  )}
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNovoFuncModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" disabled={enviando} className="disabled:opacity-50 px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
