<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGO — Sistema Integrado de Gestão de Obras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const paths = {
        building: <><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></>,
        package: <><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></>,
        dashboard: <><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></>,
        cart: <><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>,
        dollar: <><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>,
        users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
        file: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></>,
        alert: <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></>,
        plus: <><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></>,
        arrowDown: <><line x1="12" x2="12" y1="5" y2="19"/><polyline points="19 12 12 19 5 12"/></>,
        arrowUp: <><line x1="12" x2="12" y1="19" y2="5"/><polyline points="5 12 12 5 19 12"/></>,
        transfer: <><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></>,
        logout: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>,
        print: <><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></>
      };
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || null}
        </svg>
      );
    };

    const BtnAcao = ({ onClick, perigo, children }) => (
      <button type="button" onClick={onClick}
        className={`text-xs font-bold px-2 py-1 rounded mr-1 border transition ${perigo ? 'border-red-200 text-red-700 hover:bg-red-50' : 'border-slate-300 text-slate-700 hover:bg-slate-100'}`}>
        {children}
      </button>
    );

    const INITIAL_DATA = {
      obras: [
        { id: 'ob1', nome: 'Residencial Jardins', endereco: 'Av. Epitácio Pessoa, 1450 - João Pessoa/PB', responsavel: 'Eng. Carlos Mendes', inicio: '2026-01-15', previsao: '2026-12-20', orcamento: 1200000, status: 'Em andamento' },
        { id: 'ob2', nome: 'Edifício Horizonte', endereco: 'Rua das Acácias, 320 - Cabedelo/PB', responsavel: 'Eng. Mariana Costa', inicio: '2026-03-01', previsao: '2027-06-30', orcamento: 2500000, status: 'Em andamento' },
        { id: 'ob3', nome: 'Galpão Logístico BR-230', endereco: 'Rodovia BR-230, Km 18 - Bayeux/PB', responsavel: 'Mestre José Antônio', inicio: '2026-02-10', previsao: '2026-09-15', orcamento: 850000, status: 'Em andamento' },
      ],
      materiais: [
        { id: 'm1', codigo: 'MAT-001', nome: 'Cimento CP-II 50kg', unidade: 'sc', min: 50, estoques: { ob1: 35, ob2: 140, ob3: 60 } },
        { id: 'm2', codigo: 'MAT-002', nome: 'Vergalhão CA-50 10mm (12m)', unidade: 'br', min: 40, estoques: { ob1: 85, ob2: 22, ob3: 55 } },
        { id: 'm3', codigo: 'MAT-003', nome: 'Areia Média Lavada', unidade: 'm³', min: 15, estoques: { ob1: 18, ob2: 30, ob3: 8 } },
        { id: 'm4', codigo: 'MAT-004', nome: 'Bloco Cerâmico 9x19x19', unidade: 'un', min: 1000, estoques: { ob1: 2400, ob2: 850, ob3: 1500 } },
        { id: 'm5', codigo: 'MAT-005', nome: 'Tubo PVC Esgoto 100mm (6m)', unidade: 'un', min: 20, estoques: { ob1: 25, ob2: 40, ob3: 12 } },
      ],
      movimentacoes: [
        { id: 'mv1', data: '2026-11-17 08:15', tipo: 'Saída', obraId: 'ob1', obraDestinoId: null, materialId: 'm1', qtd: 15, responsavel: 'Pedro Silva (Pedreiro)', obs: 'Concretagem pilares Térreo' },
        { id: 'mv2', data: '2026-11-16 14:40', tipo: 'Transferência', obraId: 'ob2', obraDestinoId: 'ob1', materialId: 'm2', qtd: 10, responsavel: 'Almoxarife Marcos', obs: 'Empréstimo emergencial entre canteiros' },
        { id: 'mv3', data: '2026-11-15 10:00', tipo: 'Entrada', obraId: 'ob2', obraDestinoId: null, materialId: 'm1', qtd: 100, responsavel: 'Almoxarife Marcos', obs: 'NF 4829 - Depósito Construir' },
      ],
      fornecedores: [
        { id: 'f1', nome: 'Depósito Construir Ltda', contato: '(83) 99911-2233', categoria: 'Básicos e Estrutural' },
        { id: 'f2', nome: 'Aço Nordeste S/A', contato: '(83) 98822-4455', categoria: 'Ferragens e Aço' },
        { id: 'f3', nome: 'Hidráulica & Elétrica PB', contato: '(83) 98733-6677', categoria: 'Instalações' },
      ],
      compras: [
        { id: 'c1', obraId: 'ob1', materialId: 'm1', fornecedorId: 'f1', qtd: 80, precoUnit: 36.50, entrega: '2026-11-20', status: 'Comprado' },
        { id: 'c2', obraId: 'ob2', materialId: 'm2', fornecedorId: 'f2', qtd: 60, precoUnit: 54.00, entrega: '2026-11-22', status: 'Solicitado' },
        { id: 'c3', obraId: 'ob3', materialId: 'm3', fornecedorId: 'f1', qtd: 20, precoUnit: 115.00, entrega: '2026-11-18', status: 'Comprado' },
      ],
      despesas: [
        { id: 'd1', obraId: 'ob1', descricao: 'Lote Cimento e Argamassa (NF 4510)', categoria: 'Material', valor: 18500, vencimento: '2026-11-10', status: 'Pago' },
        { id: 'd2', obraId: 'ob1', descricao: 'Folha Quinzenal Equipe Campo', categoria: 'Mão de Obra', valor: 42000, vencimento: '2026-11-20', status: 'A pagar' },
        { id: 'd3', obraId: 'ob2', descricao: 'Aço Estrutural Fundação', categoria: 'Material', valor: 64200, vencimento: '2026-11-12', status: 'Pago' },
        { id: 'd4', obraId: 'ob3', descricao: 'Locação Betoneira e Andaimes', categoria: 'Equipamentos', valor: 6800, vencimento: '2026-11-25', status: 'A pagar' },
      ],
      funcionarios: [
        { id: 'fn1', nome: 'José Antônio', funcao: 'Mestre de Obras', obraId: 'ob1', presenca: 'Presente' },
        { id: 'fn2', nome: 'Pedro Silva', funcao: 'Pedreiro', obraId: 'ob1', presenca: 'Presente' },
        { id: 'fn3', nome: 'Marcos Vinícius', funcao: 'Almoxarife', obraId: 'ob2', presenca: 'Presente' },
        { id: 'fn4', nome: 'Roberto Alves', funcao: 'Servente', obraId: 'ob2', presenca: 'Falta' },
        { id: 'fn5', nome: 'Lucas Ferreira', funcao: 'Armador', obraId: 'ob3', presenca: 'Presente' },
      ]
    };

    const formatBRL = (val) => Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    // ---------- Datas sempre no fuso local (evita "pular" de dia após 21h por causa do UTC) ----------
    const pad2 = (n) => String(n).padStart(2, '0');
    const isoLocal = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const hojeISO = () => isoLocal(new Date());
    const somaDias = (dias) => { const d = new Date(); d.setDate(d.getDate() + dias); return isoLocal(d); };
    const agoraStr = () => { const d = new Date(); return `${isoLocal(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
    const fmtData = (iso) => (iso && /^\d{4}-\d{2}-\d{2}/.test(iso)) ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) + iso.slice(10) : (iso || '-');
    const novoId = (prefixo) => prefixo + Date.now() + Math.random().toString(36).slice(2, 6);
    const proximoCodigo = (materiais) => {
      const max = materiais.reduce((acc, m) => {
        const n = parseInt(String(m.codigo || '').replace(/\D/g, ''), 10);
        return isNaN(n) ? acc : Math.max(acc, n);
      }, 0);
      return 'MAT-' + String(max + 1).padStart(3, '0');
    };

    // ---------- Usuários e permissões por perfil ----------
    // ATENÇÃO: enquanto o sistema não tiver servidor/banco, este controle é apenas de interface.
    const USUARIOS = [
      { email: 'engenheiro@sigo.com.br', senha: '123456', nome: 'Engenheiro / Admin', perfil: 'Engenheiro' },
      { email: 'almoxarife@sigo.com.br', senha: '123456', nome: 'Almoxarife', perfil: 'Almoxarife' },
      { email: 'mestre@sigo.com.br', senha: '123456', nome: 'Mestre de Obras', perfil: 'Mestre de Obras' },
    ];

    const PERMISSOES = {
      'Engenheiro': {
        abaInicial: 'dashboard',
        abas: ['materiais', 'dashboard', 'obras', 'compras', 'financeiro', 'funcionarios', 'relatorios'],
        acoes: ['*'],
      },
      'Almoxarife': {
        abaInicial: 'materiais',
        abas: ['materiais', 'obras', 'compras', 'relatorios'],
        acoes: ['mov.Entrada', 'mov.Saída', 'mov.Transferência', 'mov.estornar', 'material.gerir', 'compra.criar', 'compra.editar', 'compra.receber'],
      },
      'Mestre de Obras': {
        abaInicial: 'materiais',
        abas: ['materiais', 'obras', 'compras', 'funcionarios'],
        acoes: ['mov.Saída', 'compra.criar', 'func.presenca'],
      },
    };

    function App() {
      const [user, setUser] = useState(null);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginSenha, setLoginSenha] = useState('');
      const [loginErro, setLoginErro] = useState('');

      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem('sigo_obras_html_v1');
          return saved ? JSON.parse(saved) : INITIAL_DATA;
        } catch { return INITIAL_DATA; }
      });

      useEffect(() => {
        try { localStorage.setItem('sigo_obras_html_v1', JSON.stringify(data)); } catch {}
      }, [data]);

      const [activeTab, setActiveTab] = useState('materiais');
      const [selectedObra, setSelectedObra] = useState('ALL');

      const [movModal, setMovModal] = useState(null);
      const [movForm, setMovForm] = useState({ obraId: '', obraDestinoId: '', materialId: '', qtd: 1, responsavel: '', obs: '' });

      // Os formulários abaixo servem para "novo" e "editar": quando o form tem `id`, é edição.
      const [novoMatModal, setNovoMatModal] = useState(false);
      const [novoMatForm, setNovoMatForm] = useState({});

      const [novaObraModal, setNovaObraModal] = useState(false);
      const [novaObraForm, setNovaObraForm] = useState({});

      const [novaCompraModal, setNovaCompraModal] = useState(false);
      const [novaCompraForm, setNovaCompraForm] = useState({});

      const [novaDespesaModal, setNovaDespesaModal] = useState(false);
      const [novaDespesaForm, setNovaDespesaForm] = useState({});

      const [novoFuncModal, setNovoFuncModal] = useState(false);
      const [novoFuncForm, setNovoFuncForm] = useState({});

      const perm = user ? PERMISSOES[user.perfil] : null;
      const can = (acao) => !!perm && (perm.acoes.includes('*') || perm.acoes.includes(acao));
      const podeVerAba = (aba) => !!perm && perm.abas.includes(aba);

      const entrar = (usuario) => {
        setUser({ nome: usuario.nome, perfil: usuario.perfil, email: usuario.email });
        setActiveTab(PERMISSOES[usuario.perfil].abaInicial);
        setLoginErro('');
        setLoginSenha('');
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const u = USUARIOS.find(x => x.email.toLowerCase() === loginEmail.trim().toLowerCase() && x.senha === loginSenha);
        if (!u) return setLoginErro('E-mail ou senha inválidos.');
        entrar(u);
      };

      const primeiraObra = () => (selectedObra !== 'ALL' ? selectedObra : data.obras[0]?.id) || '';

      // ---------- Abertura de formulários (novo / editar) ----------
      const abrirMaterial = (mat) => {
        setNovoMatForm(mat ? { id: mat.id, codigo: mat.codigo, nome: mat.nome, unidade: mat.unidade, min: mat.min }
                           : { codigo: proximoCodigo(data.materiais), nome: '', unidade: 'un', min: 10 });
        setNovoMatModal(true);
      };
      const abrirObra = (obra) => {
        setNovaObraForm(obra ? { ...obra } : { nome: '', endereco: '', responsavel: '', inicio: hojeISO(), previsao: somaDias(365), orcamento: '', status: 'Em andamento' });
        setNovaObraModal(true);
      };
      const abrirCompra = (compra, materialId) => {
        setNovaCompraForm(compra ? { ...compra } : {
          obraId: primeiraObra(), materialId: materialId || data.materiais[0]?.id || '',
          fornecedorId: data.fornecedores[0]?.id || '', qtd: '', precoUnit: '', entrega: somaDias(7)
        });
        setNovaCompraModal(true);
      };
      const abrirDespesa = (desp) => {
        setNovaDespesaForm(desp ? { ...desp } : { obraId: primeiraObra(), descricao: '', categoria: 'Material', valor: '', vencimento: somaDias(15), status: 'A pagar' });
        setNovaDespesaModal(true);
      };
      const abrirFuncionario = (func) => {
        setNovoFuncForm(func ? { ...func } : { nome: '', funcao: 'Pedreiro', obraId: primeiraObra() });
        setNovoFuncModal(true);
      };
      const abrirMov = (tipo) => {
        const origem = tipo === 'Transferência' ? (data.obras[0]?.id || '') : primeiraObra();
        const destino = data.obras.find(o => o.id !== origem)?.id || origem;
        setMovForm({
          obraId: origem, obraDestinoId: destino,
          materialId: data.materiais.some(m => m.id === movForm.materialId) ? movForm.materialId : (data.materiais[0]?.id || ''),
          qtd: '', responsavel: tipo === 'Saída' ? '' : user.nome, obs: ''
        });
        setMovModal(tipo);
      };

      // ---------- Exclusões (com bloqueio quando há vínculos) ----------
      const excluirObra = (obra) => {
        const temEstoque = data.materiais.some(m => (m.estoques[obra.id] || 0) > 0);
        const temVinculo = data.movimentacoes.some(m => m.obraId === obra.id || m.obraDestinoId === obra.id)
          || data.compras.some(c => c.obraId === obra.id) || data.despesas.some(d => d.obraId === obra.id)
          || data.funcionarios.some(f => f.obraId === obra.id);
        if (temEstoque || temVinculo) {
          return alert('Esta obra já tem estoque, movimentações, compras, despesas ou funcionários vinculados e não pode ser excluída.\n\nUse "Editar" e altere o status para "Concluída" ou "Paralisada".');
        }
        if (!confirm(`Excluir a obra "${obra.nome}"?`)) return;
        if (selectedObra === obra.id) setSelectedObra('ALL');
        setData(prev => ({
          ...prev,
          obras: prev.obras.filter(o => o.id !== obra.id),
          materiais: prev.materiais.map(m => { const e = { ...m.estoques }; delete e[obra.id]; return { ...m, estoques: e }; })
        }));
      };

      const excluirMaterial = (mat) => {
        const saldo = Object.values(mat.estoques).reduce((s, v) => s + Number(v || 0), 0);
        const temVinculo = data.movimentacoes.some(m => m.materialId === mat.id) || data.compras.some(c => c.materialId === mat.id);
        if (saldo > 0 || temVinculo) {
          return alert('Este material tem saldo em estoque ou histórico de movimentações/compras e não pode ser excluído. Você pode editar o nome, a unidade ou o mínimo.');
        }
        if (!confirm(`Excluir o material "${mat.nome}"?`)) return;
        setData(prev => ({ ...prev, materiais: prev.materiais.filter(m => m.id !== mat.id) }));
      };

      const cancelarCompra = (compra) => {
        if (!confirm('Cancelar esta solicitação de compra?')) return;
        setData(prev => ({ ...prev, compras: prev.compras.map(c => c.id === compra.id ? { ...c, status: 'Cancelado' } : c) }));
      };

      const excluirDespesa = (desp) => {
        if (!confirm(`Excluir a despesa "${desp.descricao}" (${formatBRL(desp.valor)})?`)) return;
        setData(prev => ({ ...prev, despesas: prev.despesas.filter(d => d.id !== desp.id) }));
      };

      const excluirFuncionario = (func) => {
        if (!confirm(`Excluir o funcionário "${func.nome}"?`)) return;
        setData(prev => ({ ...prev, funcionarios: prev.funcionarios.filter(f => f.id !== func.id) }));
      };

      // ---------- Estorno de movimentação (nunca apaga: lança o movimento inverso) ----------
      const estornarMov = (mv) => {
        const mat = getMat(mv.materialId);
        if (!mat) return alert('Material não encontrado.');
        const qtd = Number(mv.qtd);
        // Para desfazer uma entrada/transferência, o saldo que recebeu o material precisa ainda tê-lo.
        const obraQuePerde = mv.tipo === 'Entrada' ? mv.obraId : mv.tipo === 'Transferência' ? mv.obraDestinoId : null;
        if (obraQuePerde && (mat.estoques[obraQuePerde] || 0) < qtd) {
          return alert(`Não é possível estornar: a obra "${getObraNome(obraQuePerde)}" tem só ${mat.estoques[obraQuePerde] || 0} ${mat.unidade} desse material (o estorno retiraria ${qtd}).`);
        }
        if (!confirm(`Estornar esta ${mv.tipo.toLowerCase()} de ${qtd} ${mat.unidade} de ${mat.nome}?\n\nO registro original será mantido e um lançamento de estorno será criado.`)) return;

        const novosEstoques = { ...mat.estoques };
        if (mv.tipo === 'Entrada') novosEstoques[mv.obraId] = (novosEstoques[mv.obraId] || 0) - qtd;
        if (mv.tipo === 'Saída') novosEstoques[mv.obraId] = (novosEstoques[mv.obraId] || 0) + qtd;
        if (mv.tipo === 'Transferência') {
          novosEstoques[mv.obraDestinoId] = (novosEstoques[mv.obraDestinoId] || 0) - qtd;
          novosEstoques[mv.obraId] = (novosEstoques[mv.obraId] || 0) + qtd;
        }
        const movEstorno = {
          id: novoId('mv'), data: agoraStr(), tipo: 'Estorno', tipoOriginal: mv.tipo, estornoDe: mv.id,
          obraId: mv.obraId, obraDestinoId: mv.obraDestinoId, materialId: mv.materialId, qtd,
          responsavel: user.nome, obs: `Estorno de ${mv.tipo.toLowerCase()} de ${fmtData(mv.data)}`
        };
        setData(prev => ({
          ...prev,
          materiais: prev.materiais.map(m => m.id === mat.id ? { ...m, estoques: novosEstoques } : m),
          movimentacoes: [movEstorno, ...prev.movimentacoes.map(m => m.id === mv.id ? { ...m, estornada: true } : m)]
        }));
      };

      const getObraNome = (id) => data.obras.find(o => o.id === id)?.nome || 'Obra';
      const getMat = (id) => data.materiais.find(m => m.id === id);

      const alertasEstoque = useMemo(() => {
        const list = [];
        data.materiais.forEach(mat => {
          data.obras.forEach(obra => {
            if (selectedObra !== 'ALL' && selectedObra !== obra.id) return;
            const saldo = mat.estoques[obra.id] || 0;
            if (saldo <= mat.min) {
              list.push({ mat, obra, saldo });
            }
          });
        });
        return list;
      }, [data.materiais, data.obras, selectedObra]);

      const handleSaveMov = (e) => {
        e.preventDefault();
        if (!can('mov.' + movModal)) return alert('Seu perfil não tem permissão para esta operação.');
        const qtd = Number(movForm.qtd);

          return alert('A obra de destino deve ser diferente da obra de origem.');
        }

        const mat = getMat(movForm.materialId);
        const saldoAtual = mat.estoques[movForm.obraId] || 0;
        if ((movModal === 'Saída' || movModal === 'Transferência') && qtd > saldoAtual) {
          return alert(`Saldo insuficiente na obra selecionada (Disponível: ${saldoAtual} ${mat.unidade}).`);
        }

        const updatedMateriais = data.materiais.map(m => {
          if (m.id !== movForm.materialId) return m;
          const novosEstoques = { ...m.estoques };
          if (movModal === 'Entrada') {
            novosEstoques[movForm.obraId] = (novosEstoques[movForm.obraId] || 0) + qtd;
          } else if (movModal === 'Saída') {
            novosEstoques[movForm.obraId] = (novosEstoques[movForm.obraId] || 0) - qtd;
          } else if (movModal === 'Transferência') {
            novosEstoques[movForm.obraId] = (novosEstoques[movForm.obraId] || 0) - qtd;
            novosEstoques[movForm.obraDestinoId] = (novosEstoques[movForm.obraDestinoId] || 0) + qtd;
          }
          return { ...m, estoques: novosEstoques };
        });

          id: novoId('mv'),
          data: agoraStr(),
          tipo: movModal,
          obraId: movForm.obraId,
          obraDestinoId: movModal === 'Transferência' ? movForm.obraDestinoId : null,
          materialId: movForm.materialId,
          qtd,
          responsavel: movForm.responsavel,
          obs: movForm.obs || '-'
        };

          ...prev,
          materiais: updatedMateriais,
          movimentacoes: [novaMov, ...prev.movimentacoes]
        }));

          materialId: compra.materialId,

                    </label>
                    <label className="text-xs font-bold uppercase text-slate-500">Previsão de término
                      <input type="date" value={novaObraForm.previsao} onChange={e => setNovaObraForm({ ...novaObraForm, previsao: e.target.value })} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal text-slate-900 normal-case" required />
                    </label>
                  </div>
                  <select value={novaObraForm.status} onChange={e => setNovaObraForm({ ...novaObraForm, status: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    <option value="Em andamento">Em andamento</option>
                    <option value="Paralisada">Paralisada</option>
                    <option value="Concluída">Concluída</option>
                  </select>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNovaObraModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">{novaObraForm.id ? 'Salvar' : 'Cadastrar'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {novaCompraModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-extrabold">{novaCompraForm.id ? 'Editar Solicitação de Compra' : 'Nova Solicitação de Compra'}</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const qtd = Number(novaCompraForm.qtd), precoUnit = Number(novaCompraForm.precoUnit);
                  if (!(qtd > 0) || !(precoUnit >= 0)) return alert('Informe quantidade e preço válidos.');
                  const campos = { ...novaCompraForm, qtd, precoUnit };
                  if (novaCompraForm.id) {
                    setData(prev => ({ ...prev, compras: prev.compras.map(c => c.id === novaCompraForm.id ? { ...c, ...campos } : c) }));
                  } else {
                    setData(prev => ({ ...prev, compras: [{ ...campos, id: novoId('c'), status: 'Solicitado', solicitante: user.nome, dataSolicitacao: hojeISO() }, ...prev.compras] }));
                  }
                  setNovaCompraModal(false);
                }} className="space-y-3 text-sm">
                  <select value={novaCompraForm.obraId} onChange={e => setNovaCompraForm({ ...novaCompraForm, obraId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                  </select>
                  <select value={novaCompraForm.materialId} onChange={e => setNovaCompraForm({ ...novaCompraForm, materialId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.materiais.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}
                  </select>
                  <select value={novaCompraForm.fornecedorId} onChange={e => setNovaCompraForm({ ...novaCompraForm, fornecedorId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.fornecedores.map(f => <option key={f.id} value={f.id}>{f.nome}</option>)}
                  </select>
                  <div className="grid grid-cols-2 gap-2">
                    <input type="number" min="0.01" step="any" placeholder="Quantidade" value={novaCompraForm.qtd} onChange={e => setNovaCompraForm({ ...novaCompraForm, qtd: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                    <input type="number" min="0" step="0.01" placeholder="Preço Unit. (R$)" value={novaCompraForm.precoUnit} onChange={e => setNovaCompraForm({ ...novaCompraForm, precoUnit: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  </div>
                  <input type="date" value={novaCompraForm.entrega} onChange={e => setNovaCompraForm({ ...novaCompraForm, entrega: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNovaCompraModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 rounded-lg font-bold">{novaCompraForm.id ? 'Salvar' : 'Solicitar'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {novaDespesaModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-extrabold">{novaDespesaForm.id ? 'Editar Despesa' : 'Lançar Despesa'}</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const valor = Number(novaDespesaForm.valor);
                  if (!(valor > 0)) return alert('Informe um valor maior que zero.');
                  const campos = { ...novaDespesaForm, valor };
                  if (novaDespesaForm.id) {
                    setData(prev => ({ ...prev, despesas: prev.despesas.map(d => d.id === novaDespesaForm.id ? { ...d, ...campos } : d) }));
                  } else {
                    setData(prev => ({ ...prev, despesas: [{ ...campos, id: novoId('d') }, ...prev.despesas] }));
                  }
                  setNovaDespesaModal(false);
                }} className="space-y-3 text-sm">
                  <select value={novaDespesaForm.obraId} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, obraId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                  </select>
                  <input type="text" placeholder="Descrição da Despesa" value={novaDespesaForm.descricao} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, descricao: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <select value={novaDespesaForm.categoria} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, categoria: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    <option value="Material">Material</option>
                    <option value="Mão de Obra">Mão de Obra</option>
                    <option value="Equipamentos">Equipamentos</option>
                    <option value="Outros">Outros</option>
                  </select>
                  <input type="number" min="0.01" step="0.01" placeholder="Valor (R$)" value={novaDespesaForm.valor} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, valor: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <input type="date" value={novaDespesaForm.vencimento} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, vencimento: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <select value={novaDespesaForm.status} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, status: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    <option value="A pagar">A pagar</option>
                    <option value="Pago">Pago</option>
                  </select>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNovaDespesaModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {novoFuncModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-extrabold">{novoFuncForm.id ? 'Editar Funcionário' : 'Cadastrar Funcionário'}</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (novoFuncForm.id) {
                    setData(prev => ({ ...prev, funcionarios: prev.funcionarios.map(f => f.id === novoFuncForm.id ? { ...f, ...novoFuncForm } : f) }));
                  } else {
                    setData(prev => ({ ...prev, funcionarios: [...prev.funcionarios, { ...novoFuncForm, id: novoId('fn'), presenca: 'Presente' }] }));
                  }
                  setNovoFuncModal(false);
                }} className="space-y-3 text-sm">
                  <input type="text" placeholder="Nome Completo" value={novoFuncForm.nome} onChange={e => setNovoFuncForm({ ...novoFuncForm, nome: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <input type="text" placeholder="Função (ex: Pedreiro, Servente)" value={novoFuncForm.funcao} onChange={e => setNovoFuncForm({ ...novoFuncForm, funcao: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <select value={novoFuncForm.obraId} onChange={e => setNovoFuncForm({ ...novoFuncForm, obraId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                  </select>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNovoFuncModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
