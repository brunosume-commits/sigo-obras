  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const paths = {

        alert: <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></>,
        plus: <><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></>,
        arrowDown: <><line x1="12" x2="12" y1="5" y2="19"/><polyline points="19 12 12 19 5 12"/></>,
        arrowUp: <><line x1="12" x2="12" y1="19" y2="5"/><polyline points="5 12 12 5 19 12"/></>,
        transfer: <><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></>,
        logout: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>,
        print: <><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></>
      };
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || null}
        </svg>
      );
    };

    const INITIAL_DATA = {
      obras: [
        { id: 'ob1', nome: 'Residencial Jardins', endereco: 'Av. Epitácio Pessoa, 1450 - João Pessoa/PB', responsavel: 'Eng. Carlos Mendes', inicio: '2026-01-15', previsao: '2026-12-20', orcamento: 1200000, status: 'Em andamento' },
        { id: 'ob2', nome: 'Edifício Horizonte', endereco: 'Rua das Acácias, 320 - Cabedelo/PB', responsavel: 'Eng. Mariana Costa', inicio: '2026-03-01', previsao: '2027-06-30', orcamento: 2500000, status: 'Em andamento' },
        { id: 'ob3', nome: 'Galpão Logístico BR-230', endereco: 'Rodovia BR-230, Km 18 - Bayeux/PB', responsavel: 'Mestre José Antônio', inicio: '2026-02-10', previsao: '2026-09-15', orcamento: 850000, status: 'Em andamento' },
      ],
      materiais: [
        { id: 'm1', codigo: 'MAT-001', nome: 'Cimento CP-II 50kg', unidade: 'sc', min: 50, estoques: { ob1: 35, ob2: 140, ob3: 60 } },
        { id: 'm2', codigo: 'MAT-002', nome: 'Vergalhão CA-50 10mm (12m)', unidade: 'br', min: 40, estoques: { ob1: 85, ob2: 22, ob3: 55 } },
        { id: 'm3', codigo: 'MAT-003', nome: 'Areia Média Lavada', unidade: 'm³', min: 15, estoques: { ob1: 18, ob2: 30, ob3: 8 } },
        { id: 'm4', codigo: 'MAT-004', nome: 'Bloco Cerâmico 9x19x19', unidade: 'un', min: 1000, estoques: { ob1: 2400, ob2: 850, ob3: 1500 } },
        { id: 'm5', codigo: 'MAT-005', nome: 'Tubo PVC Esgoto 100mm (6m)', unidade: 'un', min: 20, estoques: { ob1: 25, ob2: 40, ob3: 12 } },
      ],
      movimentacoes: [
        { id: 'mv1', data: '2026-11-17 08:15', tipo: 'Saída', obraId: 'ob1', obraDestinoId: null, materialId: 'm1', qtd: 15, responsavel: 'Pedro Silva (Pedreiro)', obs: 'Concretagem pilares Térreo' },
        { id: 'mv2', data: '2026-11-16 14:40', tipo: 'Transferência', obraId: 'ob2', obraDestinoId: 'ob1', materialId: 'm2', qtd: 10, responsavel: 'Almoxarife Marcos', obs: 'Empréstimo emergencial entre canteiros' },
        { id: 'mv3', data: '2026-11-15 10:00', tipo: 'Entrada', obraId: 'ob2', obraDestinoId: null, materialId: 'm1', qtd: 100, responsavel: 'Almoxarife Marcos', obs: 'NF 4829 - Depósito Construir' },
      ],
      fornecedores: [
        { id: 'f1', nome: 'Depósito Construir Ltda', contato: '(83) 99911-2233', categoria: 'Básicos e Estrutural' },
        { id: 'f2', nome: 'Aço Nordeste S/A', contato: '(83) 98822-4455', categoria: 'Ferragens e Aço' },
        { id: 'f3', nome: 'Hidráulica & Elétrica PB', contato: '(83) 98733-6677', categoria: 'Instalações' },
      ],
      compras: [
        { id: 'c1', obraId: 'ob1', materialId: 'm1', fornecedorId: 'f1', qtd: 80, precoUnit: 36.50, entrega: '2026-11-20', status: 'Comprado' },
        { id: 'c2', obraId: 'ob2', materialId: 'm2', fornecedorId: 'f2', qtd: 60, precoUnit: 54.00, entrega: '2026-11-22', status: 'Solicitado' },
        { id: 'c3', obraId: 'ob3', materialId: 'm3', fornecedorId: 'f1', qtd: 20, precoUnit: 115.00, entrega: '2026-11-18', status: 'Comprado' },
      ],
      despesas: [
        { id: 'd1', obraId: 'ob1', descricao: 'Lote Cimento e Argamassa (NF 4510)', categoria: 'Material', valor: 18500, vencimento: '2026-11-10', status: 'Pago' },
        { id: 'd2', obraId: 'ob1', descricao: 'Folha Quinzenal Equipe Campo', categoria: 'Mão de Obra', valor: 42000, vencimento: '2026-11-20', status: 'A pagar' },
        { id: 'd3', obraId: 'ob2', descricao: 'Aço Estrutural Fundação', categoria: 'Material', valor: 64200, vencimento: '2026-11-12', status: 'Pago' },
        { id: 'd4', obraId: 'ob3', descricao: 'Locação Betoneira e Andaimes', categoria: 'Equipamentos', valor: 6800, vencimento: '2026-11-25', status: 'A pagar' },
      ],
      funcionarios: [
        { id: 'fn1', nome: 'José Antônio', funcao: 'Mestre de Obras', obraId: 'ob1', presenca: 'Presente' },
        { id: 'fn2', nome: 'Pedro Silva', funcao: 'Pedreiro', obraId: 'ob1', presenca: 'Presente' },
        { id: 'fn3', nome: 'Marcos Vinícius', funcao: 'Almoxarife', obraId: 'ob2', presenca: 'Presente' },
        { id: 'fn4', nome: 'Roberto Alves', funcao: 'Servente', obraId: 'ob2', presenca: 'Falta' },
        { id: 'fn5', nome: 'Lucas Ferreira', funcao: 'Armador', obraId: 'ob3', presenca: 'Presente' },
      ]
    };

    const formatBRL = (val) => Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    function App() {
      const [user, setUser] = useState(null);
      const [loginEmail, setLoginEmail] = useState('almoxarife@sigo.com.br');
      const [loginSenha, setLoginSenha] = useState('123456');

      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem('sigo_obras_html_v1');
          return saved ? JSON.parse(saved) : INITIAL_DATA;
        } catch { return INITIAL_DATA; }
      });

      useEffect(() => {
        try { localStorage.setItem('sigo_obras_html_v1', JSON.stringify(data)); } catch {}
      }, [data]);

      const [activeTab, setActiveTab] = useState('materiais');
      const [selectedObra, setSelectedObra] = useState('ALL');

      const [movModal, setMovModal] = useState(null);
      const [movForm, setMovForm] = useState({ obraId: 'ob1', obraDestinoId: 'ob2', materialId: 'm1', qtd: 10, responsavel: '', obs: '' });

      const [novoMatModal, setNovoMatModal] = useState(false);
      const [novoMatForm, setNovoMatForm] = useState({ codigo: 'MAT-006', nome: '', unidade: 'un', min: 10 });

      const [novaObraModal, setNovaObraModal] = useState(false);
      const [novaObraForm, setNovaObraForm] = useState({ nome: '', endereco: '', responsavel: '', inicio: '2026-11-17', previsao: '2027-08-30', orcamento: 1000000 });

      const [novaCompraModal, setNovaCompraModal] = useState(false);
      const [novaCompraForm, setNovaCompraForm] = useState({ obraId: 'ob1', materialId: 'm1', fornecedorId: 'f1', qtd: 20, precoUnit: 35, entrega: '2026-11-25' });

      const [novaDespesaModal, setNovaDespesaModal] = useState(false);
      const [novaDespesaForm, setNovaDespesaForm] = useState({ obraId: 'ob1', descricao: '', categoria: 'Material', valor: 1000, vencimento: '2026-11-30', status: 'A pagar' });

      const [novoFuncModal, setNovoFuncModal] = useState(false);
      const [novoFuncForm, setNovoFuncForm] = useState({ nome: '', funcao: 'Pedreiro', obraId: 'ob1' });

      const handleQuickLogin = (perfil, defaultTab) => {
        setUser({ nome: perfil, perfil });
        setActiveTab(defaultTab);
      };

      const getObraNome = (id) => data.obras.find(o => o.id === id)?.nome || 'Obra';
      const getMat = (id) => data.materiais.find(m => m.id === id);

      const alertasEstoque = useMemo(() => {
        const list = [];
        data.materiais.forEach(mat => {
          data.obras.forEach(obra => {
            if (selectedObra !== 'ALL' && selectedObra !== obra.id) return;
            const saldo = mat.estoques[obra.id] || 0;
            if (saldo <= mat.min) {
              list.push({ mat, obra, saldo });
            }
          });
        });
        return list;
      }, [data.materiais, data.obras, selectedObra]);

      const handleSaveMov = (e) => {
        e.preventDefault();
        const qtd = Number(movForm.qtd);
        if (qtd <= 0 || !movForm.responsavel.trim()) return alert('Informe a quantidade e o responsável.');

        if (movModal === 'Transferência' && movForm.obraId === movForm.obraDestinoId) {
          return alert('A obra de destino deve ser diferente da obra de origem.');
        }

        const mat = getMat(movForm.materialId);
        const saldoAtual = mat.estoques[movForm.obraId] || 0;
        if ((movModal === 'Saída' || movModal === 'Transferência') && qtd > saldoAtual) {
          return alert(`Saldo insuficiente na obra selecionada (Disponível: ${saldoAtual} ${mat.unidade}).`);
        }

        const updatedMateriais = data.materiais.map(m => {
          if (m.id !== movForm.materialId) return m;
          const novosEstoques = { ...m.estoques };
          if (movModal === 'Entrada') {
            novosEstoques[movForm.obraId] = (novosEstoques[movForm.obraId] || 0) + qtd;
          } else if (movModal === 'Saída') {
            novosEstoques[movForm.obraId] = (novosEstoques[movForm.obraId] || 0) - qtd;
          } else if (movModal === 'Transferência') {
            novosEstoques[movForm.obraId] = (novosEstoques[movForm.obraId] || 0) - qtd;
            novosEstoques[movForm.obraDestinoId] = (novosEstoques[movForm.obraDestinoId] || 0) + qtd;
          }
          return { ...m, estoques: novosEstoques };
        });

        const now = new Date();
        const dataStr = now.toISOString().slice(0, 10) + ' ' + now.toTimeString().slice(0, 5);
        const novaMov = {
          id: 'mv' + Date.now(),
          data: dataStr,
          tipo: movModal,
          obraId: movForm.obraId,
          obraDestinoId: movModal === 'Transferência' ? movForm.obraDestinoId : null,
          materialId: movForm.materialId,
          qtd,
          responsavel: movForm.responsavel,
          obs: movForm.obs || '-'
        };

        setData(prev => ({
          ...prev,
          materiais: updatedMateriais,
          movimentacoes: [novaMov, ...prev.movimentacoes]
        }));
        setMovModal(null);
      };

      const handleConfirmarEntregaCompra = (compra) => {
        const updatedCompras = data.compras.map(c => c.id === compra.id ? { ...c, status: 'Entregue' } : c);
        const updatedMateriais = data.materiais.map(m => {
          if (m.id !== compra.materialId) return m;
          return {
            ...m,
            estoques: {
              ...m.estoques,
              [compra.obraId]: (m.estoques[compra.obraId] || 0) + Number(compra.qtd)
            }
          };
        });
        const mat = getMat(compra.materialId);
        const novaDespesa = {
          id: 'd' + Date.now(),
          obraId: compra.obraId,
          descricao: `Compra: ${compra.qtd} ${mat?.unidade} de ${mat?.nome}`,
          categoria: 'Material',
          valor: Number(compra.qtd) * Number(compra.precoUnit),
          vencimento: compra.entrega,
          status: 'A pagar'
        };
        const novaMov = {
          id: 'mv' + Date.now(),
          data: new Date().toISOString().slice(0, 10) + ' 12:00',
          tipo: 'Entrada',
          obraId: compra.obraId,
          obraDestinoId: null,
          materialId: compra.materialId,
          qtd: Number(compra.qtd),
          responsavel: user.nome,
          obs: 'Recebimento automático via Módulo de Compras'
        };
        setData(prev => ({
          ...prev,
          compras: updatedCompras,
          materiais: updatedMateriais,
          despesas: [novaDespesa, ...prev.despesas],
          movimentacoes: [novaMov, ...prev.movimentacoes]
        }));
      };

      if (!user) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
              <div className="bg-amber-500 p-6 text-slate-950">
                <div className="flex items-center gap-3">
                  <div className="bg-slate-950 text-amber-400 p-2.5 rounded-xl">
                    <Icon name="building" className="w-7 h-7" />
                  </div>
                  <div>
                    <h1 className="text-2xl font-black tracking-tight">SIGO</h1>
                    <p className="text-xs font-semibold uppercase tracking-wider text-slate-900/80">Sistema Integrado de Gestão de Obras</p>
                  </div>
                </div>
              </div>
              <div className="p-6 space-y-5">
                <form onSubmit={(e) => { e.preventDefault(); handleQuickLogin('Administrador', 'dashboard'); }} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Usuário / E-mail</label>
                    <input type="email" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Senha</label>
                    <input type="password" value={loginSenha} onChange={e => setLoginSenha(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" required />
                  </div>
                  <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg transition">
                    Entrar no Sistema
                  </button>
                </form>

                <div className="pt-4 border-t border-slate-100">
                  <p className="text-xs font-semibold text-slate-400 text-center mb-3">Acesso Rápido por Perfil Operacional</p>
                  <div className="grid grid-cols-3 gap-2">
                    <button onClick={() => handleQuickLogin('Almoxarife', 'materiais')} className="p-2.5 rounded-lg border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-900 text-xs font-bold text-center transition">
                      Almoxarife<br/><span className="font-normal text-[10px]">Estoque Multiobra</span>
                    </button>
                    <button onClick={() => handleQuickLogin('Mestre de Obras', 'materiais')} className="p-2.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-800 text-xs font-bold text-center transition">
                      Mestre Obras<br/><span className="font-normal text-[10px]">Canteiro / Equipe</span>
                    </button>
                    <button onClick={() => handleQuickLogin('Engenheiro / Admin', 'dashboard')} className="p-2.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-800 text-xs font-bold text-center transition">
                      Engenheiro<br/><span className="font-normal text-[10px]">Painel & Custos</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const menuItems = [
        { id: 'materiais', label: 'Controle de Materiais', icon: 'package', badge: alertasEstoque.length || null },
        { id: 'dashboard', label: 'Painel Principal', icon: 'dashboard' },
        { id: 'obras', label: 'Cadastro de Obras', icon: 'building' },
        { id: 'compras', label: 'Compras & Fornecedores', icon: 'cart' },
        { id: 'financeiro', label: 'Controle Financeiro', icon: 'dollar' },
        { id: 'funcionarios', label: 'Funcionários', icon: 'users' },
        { id: 'relatorios', label: 'Relatórios', icon: 'file' },
      ];

      const obrasVisiveis = selectedObra === 'ALL' ? data.obras : data.obras.filter(o => o.id === selectedObra);
      const movsVisiveis = selectedObra === 'ALL' ? data.movimentacoes : data.movimentacoes.filter(m => m.obraId === selectedObra || m.obraDestinoId === selectedObra);
      const comprasVisiveis = selectedObra === 'ALL' ? data.compras : data.compras.filter(c => c.obraId === selectedObra);
      const despesasVisiveis = selectedObra === 'ALL' ? data.despesas : data.despesas.filter(d => d.obraId === selectedObra);
      const funcsVisiveis = selectedObra === 'ALL' ? data.funcionarios : data.funcionarios.filter(f => f.obraId === selectedObra);

      const totalOrcado = obrasVisiveis.reduce((acc, o) => acc + Number(o.orcamento), 0);
      const totalGasto = despesasVisiveis.reduce((acc, d) => acc + Number(d.valor), 0);
      const totalMateriaisGasto = despesasVisiveis.filter(d => d.categoria === 'Material').reduce((acc, d) => acc + Number(d.valor), 0);

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          <aside className="no-print w-full md:w-64 bg-slate-900 text-slate-200 flex flex-col shrink-0">
            <div className="p-5 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="bg-amber-500 text-slate-950 p-1.5 rounded-lg">
                  <Icon name="building" className="w-5 h-5" />
                </div>
                <div>
                  <span className="font-black text-lg text-white tracking-tight">SIGO</span>
                  <span className="block text-[10px] text-slate-400 uppercase tracking-wider">Gestão de Obras</span>
                </div>
              </div>
            </div>

            <nav className="flex-1 p-3 space-y-1 overflow-x-auto flex md:block">
              {menuItems.map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition whitespace-nowrap ${
                    activeTab === item.id ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <span className="flex items-center gap-2.5">
                    <Icon name={item.icon} className="w-4 h-4" />
                    {item.label}
                  </span>
                  {item.badge ? (
                    <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${activeTab === item.id ? 'bg-slate-950 text-amber-400' : 'bg-red-500 text-white'}`}>
                      {item.badge}
                    </span>
                  ) : null}
                </button>
              ))}
            </nav>

            <div className="p-4 border-t border-slate-800 flex items-center justify-between text-xs">
              <div>
                <p className="font-bold text-white">{user.nome}</p>
                <p className="text-slate-400">Online • Banco Integrado</p>
              </div>
              <button onClick={() => setUser(null)} title="Sair" className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800">
                <Icon name="logout" className="w-4 h-4" />
              </button>
            </div>

                            <li key={o.id} className="flex justify-between border-b border-slate-100 pb-1.5">
                              <span>{o.nome}</span>
                              <span className="font-bold">{formatBRL(gasto)} / {formatBRL(o.orcamento)}</span>
                            </li>
                          );
                        })}
                      </ul>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-slate-200">
                      <h4 className="font-bold text-slate-900 mb-3">2. Compras Pendentes de Entrega</h4>
                      <ul className="space-y-2 text-sm">
                        {comprasVisiveis.filter(c => c.status !== 'Entregue').map(c => (
                          <li key={c.id} className="flex justify-between border-b border-slate-100 pb-1.5">
                            <span>{getMat(c.materialId)?.nome} ({getObraNome(c.obraId)})</span>
                            <span className="font-bold">{c.qtd} un • Prev: {c.entrega}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>

          {movModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
                <h3 className="text-lg font-extrabold text-slate-900">Registrar {movModal} de Material</h3>
                <form onSubmit={handleSaveMov} className="space-y-3 text-sm">
                  <div>
                    <label className="block font-bold text-xs uppercase text-slate-500 mb-1">
                      {movModal === 'Transferência' ? 'Obra de Origem' : 'Obra'}
                    </label>
                    <select value={movForm.obraId} onChange={e => setMovForm({ ...movForm, obraId: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2">
                      {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                    </select>
                  </div>

                  {movModal === 'Transferência' && (
                    <div>
                      <label className="block font-bold text-xs uppercase text-slate-500 mb-1">Obra de Destino</label>
                      <select value={movForm.obraDestinoId} onChange={e => setMovForm({ ...movForm, obraDestinoId: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2">
                        {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                      </select>
                    </div>
                  )}

                  <div>
                    <label className="block font-bold text-xs uppercase text-slate-500 mb-1">Material</label>
                    <select value={movForm.materialId} onChange={e => setMovForm({ ...movForm, materialId: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2">
                      {data.materiais.map(m => (
                        <option key={m.id} value={m.id}>{m.nome} (Saldo: {m.estoques[movForm.obraId] || 0} {m.unidade})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block font-bold text-xs uppercase text-slate-500 mb-1">Quantidade</label>
                    <input type="number" min="1" value={movForm.qtd} onChange={e => setMovForm({ ...movForm, qtd: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2" required />
                  </div>

                  <div>
                    <label className="block font-bold text-xs uppercase text-slate-500 mb-1">Quem retirou / recebeu?</label>
                    <input type="text" placeholder="Ex: João Pedreiro / Almoxarife" value={movForm.responsavel} onChange={e => setMovForm({ ...movForm, responsavel: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2" required />
                  </div>

                  <div>
                    <label className="block font-bold text-xs uppercase text-slate-500 mb-1">Observação / Etapa</label>
                    <input type="text" placeholder="Ex: Alvenaria 2º pavimento" value={movForm.obs} onChange={e => setMovForm({ ...movForm, obs: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2" />
                  </div>

                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setMovModal(null)} className="px-4 py-2 rounded-lg border border-slate-300 font-bold text-slate-600">Cancelar</button>
                    <button type="submit" className="px-4 py-2 rounded-lg bg-slate-900 text-white font-bold">Confirmar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {novoMatModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-extrabold">Cadastrar Novo Material</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const estoques = {};
                  data.obras.forEach(o => estoques[o.id] = 0);
                  setData(prev => ({
                    ...prev,
                    materiais: [...prev.materiais, { id: 'm' + Date.now(), ...novoMatForm, min: Number(novoMatForm.min), estoques }]
                  }));
                  setNovoMatModal(false);
                }} className="space-y-3 text-sm">
                  <input type="text" placeholder="Código (ex: MAT-006)" value={novoMatForm.codigo} onChange={e => setNovoMatForm({ ...novoMatForm, codigo: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <input type="text" placeholder="Nome do Material" value={novoMatForm.nome} onChange={e => setNovoMatForm({ ...novoMatForm, nome: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" placeholder="Unidade (sc, kg, un)" value={novoMatForm.unidade} onChange={e => setNovoMatForm({ ...novoMatForm, unidade: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                    <input type="number" placeholder="Estoque Mínimo" value={novoMatForm.min} onChange={e => setNovoMatForm({ ...novoMatForm, min: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNovoMatModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {novaObraModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-extrabold">Cadastrar Nova Obra</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const newId = 'ob' + Date.now();
                  setData(prev => ({
                    ...prev,
                    obras: [...prev.obras, { id: newId, ...novaObraForm, orcamento: Number(novaObraForm.orcamento), status: 'Em andamento' }],
                    materiais: prev.materiais.map(m => ({ ...m, estoques: { ...m.estoques, [newId]: 0 } }))
                  }));
                  setNovaObraModal(false);
                }} className="space-y-3 text-sm">
                  <input type="text" placeholder="Nome da Obra" value={novaObraForm.nome} onChange={e => setNovaObraForm({ ...novaObraForm, nome: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <input type="text" placeholder="Endereço Completo" value={novaObraForm.endereco} onChange={e => setNovaObraForm({ ...novaObraForm, endereco: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <input type="text" placeholder="Engenheiro / Mestre Responsável" value={novaObraForm.responsavel} onChange={e => setNovaObraForm({ ...novaObraForm, responsavel: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <input type="number" placeholder="Orçamento Previsto (R$)" value={novaObraForm.orcamento} onChange={e => setNovaObraForm({ ...novaObraForm, orcamento: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNovaObraModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">Cadastrar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {novaCompraModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-extrabold">Nova Solicitação de Compra</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  setData(prev => ({
                    ...prev,
                    compras: [{ id: 'c' + Date.now(), ...novaCompraForm, qtd: Number(novaCompraForm.qtd), precoUnit: Number(novaCompraForm.precoUnit), status: 'Solicitado' }, ...prev.compras]
                  }));
                  setNovaCompraModal(false);
                }} className="space-y-3 text-sm">
                  <select value={novaCompraForm.obraId} onChange={e => setNovaCompraForm({ ...novaCompraForm, obraId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                  </select>
                  <select value={novaCompraForm.materialId} onChange={e => setNovaCompraForm({ ...novaCompraForm, materialId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.materiais.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}
                  </select>
                  <select value={novaCompraForm.fornecedorId} onChange={e => setNovaCompraForm({ ...novaCompraForm, fornecedorId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.fornecedores.map(f => <option key={f.id} value={f.id}>{f.nome}</option>)}
                  </select>
                  <div className="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Quantidade" value={novaCompraForm.qtd} onChange={e => setNovaCompraForm({ ...novaCompraForm, qtd: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                    <input type="number" step="0.01" placeholder="Preço Unit. (R$)" value={novaCompraForm.precoUnit} onChange={e => setNovaCompraForm({ ...novaCompraForm, precoUnit: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  </div>
                  <input type="date" value={novaCompraForm.entrega} onChange={e => setNovaCompraForm({ ...novaCompraForm, entrega: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNovaCompraModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 rounded-lg font-bold">Solicitar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {novaDespesaModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-extrabold">Lançar Despesa</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  setData(prev => ({
                    ...prev,
                    despesas: [{ id: 'd' + Date.now(), ...novaDespesaForm, valor: Number(novaDespesaForm.valor) }, ...prev.despesas]
                  }));
                  setNovaDespesaModal(false);
                }} className="space-y-3 text-sm">
                  <select value={novaDespesaForm.obraId} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, obraId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                  </select>
                  <input type="text" placeholder="Descrição da Despesa" value={novaDespesaForm.descricao} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, descricao: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <select value={novaDespesaForm.categoria} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, categoria: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    <option value="Material">Material</option>
                    <option value="Mão de Obra">Mão de Obra</option>
                    <option value="Equipamentos">Equipamentos</option>
                    <option value="Outros">Outros</option>
                  </select>
                  <input type="number" step="0.01" placeholder="Valor (R$)" value={novaDespesaForm.valor} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, valor: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <input type="date" value={novaDespesaForm.vencimento} onChange={e => setNovaDespesaForm({ ...novaDespesaForm, vencimento: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNovaDespesaModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {novoFuncModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-extrabold">Cadastrar Funcionário</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  setData(prev => ({
                    ...prev,
                    funcionarios: [...prev.funcionarios, { id: 'fn' + Date.now(), ...novoFuncForm, presenca: 'Presente' }]
                  }));
                  setNovoFuncModal(false);
                }} className="space-y-3 text-sm">
                  <input type="text" placeholder="Nome Completo" value={novoFuncForm.nome} onChange={e => setNovoFuncForm({ ...novoFuncForm, nome: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <input type="text" placeholder="Função (ex: Pedreiro, Servente)" value={novoFuncForm.funcao} onChange={e => setNovoFuncForm({ ...novoFuncForm, funcao: e.target.value })} className="w-full border rounded-lg px-3 py-2" required />
                  <select value={novoFuncForm.obraId} onChange={e => setNovoFuncForm({ ...novoFuncForm, obraId: e.target.value })} className="w-full border rounded-lg px-3 py-2">
                    {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                  </select>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNovoFuncModal(false)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
