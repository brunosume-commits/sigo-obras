        settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
        chevronDown: <><polyline points="6 9 12 15 18 9"/></>,
        print: <><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></>

    const BtnAcao = ({ onClick, perigo, children }) => (
      <button type="button" onClick={onClick}
        className={`text-xs font-bold px-2 py-1 rounded mr-1 border transition ${perigo ? 'border-red-200 text-red-700 hover:bg-red-50' : 'border-slate-300 text-slate-700 hover:bg-slate-100'}`}>
        {children}
      </button>
    );


    const formatBRL = (val) => Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    // ---------- Datas sempre no fuso local (evita "pular" de dia após 21h por causa do UTC) ----------
    const pad2 = (n) => String(n).padStart(2, '0');
    const isoLocal = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const hojeISO = () => isoLocal(new Date());
    const somaDias = (dias) => { const d = new Date(); d.setDate(d.getDate() + dias); return isoLocal(d); };
    const segundaDe = (iso) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoLocal(d); };
    const CAUSAS_PPC = ['Material', 'Mão de obra', 'Equipamento', 'Projeto ou definição', 'Clima', 'Serviço anterior', 'Mudança de prioridade', 'Meta irreal', 'Outros'];
    // Grupos do menu lateral (o Painel Principal fica sozinho no topo)
    const GRUPOS_MENU = [
      { id: 'canteiro', label: 'Canteiro', icon: 'building', abas: ['planejamento', 'diario', 'materiais', 'epi', 'qualidade', 'consumo', 'produtividade'] },
      { id: 'escritorio', label: 'Escritório', icon: 'briefcase', abas: ['obras', 'orcamento', 'compras', 'medicoes', 'financeiro', 'caixa', 'funcionarios', 'folha', 'documentos', 'relatorios'] },
      { id: 'admin', label: 'Administração', icon: 'settings', abas: ['portal', 'usuarios'] },
    ];
    const grupoDaAba = (id) => GRUPOS_MENU.find(g => g.abas.includes(id))?.id || null;
    const somaDiasDe = (iso, dias) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + dias); return isoLocal(d); };
    const fmtData = (iso) => (iso && /^\d{4}-\d{2}-\d{2}/.test(iso)) ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) + iso.slice(10) : (iso || '-');
    const CATEGORIAS_PADRAO = ['Cimentos e argamassas', 'Agregados', 'Alvenaria', 'Aço e ferragens', 'Hidráulica', 'Elétrica', 'Acabamentos', 'Madeiras', 'Ferramentas e EPI', 'Geral'];
    const NOMES_MES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    const diasDoMes = (mes) => { const [a, m] = mes.split('-').map(Number); return new Date(a, m, 0).getDate(); };
    const semAcento = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    // ---------- Nota fiscal eletrônica (XML da NF-e) ----------
    const lerXmlNFe = (texto) => {
      const doc = new DOMParser().parseFromString(String(texto || '').replace(/^\uFEFF/, ''), 'application/xml');
      if (doc.getElementsByTagName('parsererror').length) throw new Error('O arquivo não é um XML válido. Use o arquivo .xml da nota (não o PDF do DANFE).');
      const inf = doc.getElementsByTagName('infNFe')[0];
      if (!inf) throw new Error('Este XML não é de uma NF-e. Use o arquivo .xml que o fornecedor envia junto com o DANFE.');
      const g = (el, tag) => el ? el.getElementsByTagName(tag)[0] : null;
      const tx = (el, tag) => { const x = g(el, tag); return x ? x.textContent.trim() : ''; };
      const nm = (el, tag) => Number(tx(el, tag)) || 0;
      let chave = (inf.getAttribute('Id') || '').replace(/\D/g, '');
      if (chave.length !== 44) chave = tx(doc, 'chNFe').replace(/\D/g, '');
      const ide = g(inf, 'ide'), emit = g(inf, 'emit'), dest = g(inf, 'dest'), tot = g(inf, 'ICMSTot');
      const avisos = [];
      const cStat = tx(g(doc, 'infProt'), 'cStat');
      if (!cStat) avisos.push('O XML não traz o protocolo de autorização da SEFAZ. Confira se a nota foi mesmo autorizada.');
      else if (!['100', '150'].includes(cStat)) avisos.push(`A SEFAZ não autorizou esta nota (situação ${cStat}: ${tx(g(doc, 'infProt'), 'xMotivo')}).`);
      if (tx(ide, 'tpNF') === '0') avisos.push('É uma nota de ENTRADA emitida pelo próprio fornecedor (ex.: devolução). Confira antes de lançar.');
      const itens = [...inf.getElementsByTagName('det')].map((d, k) => {
        const pr = g(d, 'prod');
        return { k, codigo: tx(pr, 'cProd'), descricao: tx(pr, 'xProd'), ncm: tx(pr, 'NCM'), unidade: tx(pr, 'uCom'),
                 qtd: nm(pr, 'qCom'), valorUnit: nm(pr, 'vUnCom'), valorTotal: nm(pr, 'vProd') };
      });
      if (!itens.length) throw new Error('A nota não tem itens.');
      return {
        chave, numero: tx(ide, 'nNF'), serie: tx(ide, 'serie'), emissao: (tx(ide, 'dhEmi') || tx(ide, 'dEmi')).slice(0, 10),
        emitente: { cnpj: tx(emit, 'CNPJ') || tx(emit, 'CPF'), nome: tx(emit, 'xNome'), fantasia: tx(emit, 'xFant') },
        destinatario: { doc: tx(dest, 'CNPJ') || tx(dest, 'CPF'), nome: tx(dest, 'xNome') },
        valorTotal: nm(tot, 'vNF'), valorProdutos: nm(tot, 'vProd'), frete: nm(tot, 'vFrete'), desconto: nm(tot, 'vDesc'),
        itens,
        parcelas: [...inf.getElementsByTagName('dup')].map(d => ({ numero: tx(d, 'nDup'), vencimento: tx(d, 'dVenc'), valor: nm(d, 'vDup') })),
        avisos,
      };
    };
    const PALAVRAS_VAZIAS = new Set(['de', 'da', 'do', 'das', 'dos', 'com', 'para', 'e', 'em', 'a', 'o', 'n', 'no', 'x', 'ltda', 'me', 'epp', 'eireli', 'sa', 'cia', 'comercio', 'industria']);
    const palavras = (t) => semAcento(t).replace(/(\w)-(\w)/g, '$1$2').replace(/[^a-z0-9]+/g, ' ').split(' ').filter(w => w && !PALAVRAS_VAZIAS.has(w));
    const semelhanca = (a, b) => {
      const A = new Set(palavras(a)), B = new Set(palavras(b));
      if (!A.size || !B.size) return 0;
      let c = 0; A.forEach(w => { if (B.has(w)) c++; });
      return 2 * c / (A.size + B.size);
    };
    const UNID_EQUIV = { br: 'br', barra: 'br', barras: 'br', sc: 'sc', saco: 'sc', sacos: 'sc', m3: 'm3', 'm³': 'm3', un: 'un', und: 'un', unid: 'un', pc: 'un', 'pç': 'un', peca: 'un', kg: 'kg', m: 'm', mt: 'm', ml: 'm', par: 'par', pr: 'par', rl: 'rl', rolo: 'rl', lt: 'l', l: 'l', m2: 'm2', 'm²': 'm2', cx: 'cx', caixa: 'cx', t: 't', ton: 't' };
    const mesmaUnidade = (a, b) => { const n = (u) => { const x = semAcento(u).replace(/[^a-z0-9²³]/g, ''); return UNID_EQUIV[x] || x; }; return n(a) === n(b); };
    const fmtChave = (c) => String(c || '').replace(/(\d{4})(?=\d)/g, '$1 ');

    // Gráfico de barras horizontais simples (sem biblioteca)
    const BarrasH = ({ itens, formato = (v) => v, vazio = 'Sem dados para exibir.' }) => {
      const max = Math.max(1, ...itens.flatMap(i => (i.series || [{ valor: i.valor }]).map(x => Number(x.valor) || 0)));
      if (!itens.length) return <p className="text-sm text-slate-400">{vazio}</p>;
      return (
        <div className="space-y-3">
          {itens.map((i, idx) => (
            <div key={idx}>
              <div className="flex justify-between text-xs mb-1 gap-2">
                <span className="font-bold text-slate-700 truncate">{i.rotulo}</span>
                {!i.series && <span className="text-slate-600 font-semibold whitespace-nowrap">{formato(i.valor)}</span>}
              </div>
              {(i.series || [{ valor: i.valor, cor: i.cor || 'bg-amber-500' }]).map((sr, k) => (
                <div key={k} className="flex items-center gap-2 mb-1">
                  <div className="flex-1 bg-slate-100 h-3 rounded-full overflow-hidden">
                    <div className={`h-full rounded-full ${sr.cor}`} style={{ width: `${Math.max(0, (Number(sr.valor) || 0) / max * 100)}%` }}></div>
                  </div>
                  {i.series && <span className="text-[11px] text-slate-600 w-40 shrink-0 text-right whitespace-nowrap">{sr.nome}: <strong>{formato(sr.valor)}</strong></span>}
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    };

    const rotuloMes = (mes) => `${NOMES_MES[Number(mes.slice(5, 7)) - 1]} de ${mes.slice(0, 4)}`;
    const somaMes = (mes, delta) => { const [a, m] = mes.split('-').map(Number); const d = new Date(a, m - 1 + delta, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };
    // Mesma regra do banco (fechar_folha): diária x presenças; mensal - (salário/30 x faltas)
    const calcularPagamento = (rem, cont) => {
      if (!rem || !(rem.valor > 0)) return 0;
      if (rem.tipo === 'Diária') return Math.round(rem.valor * cont.Presente * 100) / 100;
      return Math.max(0, Math.round((rem.valor - rem.valor / 30 * cont.Falta) * 100) / 100);
    };

    const CLIMAS = ['Bom', 'Nublado', 'Chuva', 'Impraticável'];
    const TIPOS_DOC = ['ASO (exame ocupacional)', 'NR-35 Trabalho em altura', 'NR-10 Eletricidade', 'NR-18 Construção civil', 'NR-12 Máquinas', 'NR-06 EPI', 'NR-33 Espaço confinado', 'Contrato', 'Seguro de vida', 'Alvará / licença', 'Outro'];
    const AVISO_DIAS = 30;
    const diasAte = (iso) => { if (!iso) return null; const [a, m, d] = iso.split('-').map(Number); const h = new Date(); return Math.round((new Date(a, m - 1, d) - new Date(h.getFullYear(), h.getMonth(), h.getDate())) / 86400000); };
    const situacaoDoc = (doc) => { const n = diasAte(doc.validade); if (n === null) return 'Sem validade'; if (n < 0) return 'Vencido'; if (n <= AVISO_DIAS) return 'Vence em breve'; return 'Em dia'; };
    // Reduz a foto (máx. 1600 px, JPEG 80%) antes de enviar: economiza dados do celular e espaço no Supabase
    const comprimirImagem = (file) => new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const esc = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('Não foi possível ler a imagem.')), 'image/jpeg', 0.8);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Arquivo de imagem inválido.')); };
      img.src = url;
    });

    const proximoCodigo = (materiais) => {
      const max = materiais.reduce((acc, m) => {
        const n = parseInt(String(m.codigo || '').replace(/\D/g, ''), 10);
        return isNaN(n) ? acc : Math.max(acc, n);
      }, 0);
      return 'MAT-' + String(max + 1).padStart(3, '0');
    };

    // ---------- Permissões por perfil (a regra de verdade está no banco: supabase/schema.sql) ----------
    const PERMISSOES = {
      'Engenheiro': {
        abaInicial: 'dashboard',
        abas: ['materiais', 'dashboard', 'obras', 'orcamento', 'planejamento', 'consumo', 'produtividade', 'diario', 'qualidade', 'compras', 'financeiro', 'caixa', 'medicoes', 'funcionarios', 'epi', 'documentos', 'folha', 'relatorios', 'portal', 'usuarios'],
        acoes: ['*'],
      },
      'Almoxarife': {
        abaInicial: 'materiais',
        abas: ['materiais', 'obras', 'diario', 'qualidade', 'compras', 'epi', 'relatorios'],
        acoes: ['mov.Entrada', 'mov.Saída', 'mov.Transferência', 'mov.estornar', 'material.gerir', 'fornecedor.gerir', 'compra.criar', 'compra.editar', 'compra.receber', 'cotacao.gerir', 'nota.lancar', 'epi.entregar', 'epi.cancelar'],
      },
      'Mestre de Obras': {
        abaInicial: 'materiais',
        abas: ['materiais', 'obras', 'orcamento', 'planejamento', 'consumo', 'produtividade', 'diario', 'qualidade', 'compras', 'funcionarios', 'epi', 'documentos'],
        acoes: ['mov.Saída', 'compra.criar', 'func.presenca', 'diario.gerir', 'epi.entregar', 'orcamento.avanco', 'producao.lancar', 'planejamento.gerir'],
      },
      'Cliente': {
        abaInicial: 'portal',
        abas: ['portal'],

      },
    };

    // ---------- Conexão com o Supabase ----------
    const SUPABASE_CONFIGURADO = SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.length > 20;
    const sb = SUPABASE_CONFIGURADO ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const DADOS_VAZIOS = { obras: [], materiais: [], movimentacoes: [], fornecedores: [], compras: [], despesas: [], funcionarios: [], perfis: [], presencas: [], remuneracoes: {}, presencasFolha: [], folha: null, folhaItens: [], diarios: [], presencasDiario: [], documentos: [], epis: [], contratos: [], contratoItens: [], medicoes: [], medicaoItens: [], etapas: [], etapaItens: [], avancoHist: [], cotacoes: [], cotacaoItens: [], cotacaoForns: [], cotacaoPrecos: [], receitas: [], caixa: null, modelos: [], inspecoes: [], pendencias: [], portal: [], clienteObras: [], servicos: [], indices: [], producoes: [], prodFuncs: [], alertasDia: null, ultimoEnvio: null, notas: [], notaItens: [], nfeMapas: [], tarefas: [] };

    // Converte timestamptz do banco para "AAAA-MM-DD HH:MM" no horário local
    const tsLocal = (ts) => { const d = new Date(ts); return `${isoLocal(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
    const num = (v) => v === null || v === undefined ? v : Number(v);

    // ---------- Orçamento e cronograma ----------
    const r2 = (v) => Math.round(v * 100) / 100;
    // "1.234,56" / "1234.56" / "R$ 10" → número
    const numBR = (t) => {
      let x = String(t ?? '').replace(/R\$|\s/g, '');
      if (!x) return NaN;
      if (x.includes(',')) x = x.replace(/\./g, '').replace(',', '.');
      return Number(x);
    };
    const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
    const mesesEntre = (ini, fim) => { const r = []; let [y, m] = ini.slice(0, 7).split('-').map(Number); const [yf, mf] = fim.slice(0, 7).split('-').map(Number);
      while (y < yf || (y === yf && m <= mf)) { r.push(`${y}-${String(m).padStart(2, '0')}`); m++; if (m > 12) { m = 1; y++; } } return r; };
    const fimDoMes = (mes) => { const [y, m] = mes.split('-').map(Number); return isoLocal(new Date(y, m, 0)); };
    // distribui o valor da etapa pelos meses, proporcional aos dias
    const distribuirPorMes = (valor, ini, fim) => {
      const tot = diasEntre(ini, fim) + 1, out = {};
      for (const mes of mesesEntre(ini, fim)) {
        const a = mes + '-01' > ini ? mes + '-01' : ini, b = fimDoMes(mes) < fim ? fimDoMes(mes) : fim;
        out[mes] = valor * (diasEntre(a, b) + 1) / tot;
      }
      return out;
    };
    // % que deveria estar pronto numa data, pelo cronograma (linear entre início e fim)
    const planejadoEm = (e, dia) => !e.inicio || !e.fim ? null : dia < e.inicio ? 0 : dia >= e.fim ? 100 : (diasEntre(e.inicio, dia) + 1) / (diasEntre(e.inicio, e.fim) + 1) * 100;
    const situacaoEtapa = (e, hoje) => {
      if (e.avanco >= 100) return 'Concluída';
      const pl = planejadoEm(e, hoje);
      if (pl === null) return e.avanco > 0 ? 'Em andamento' : 'Sem datas';
      if (pl - e.avanco > 10) return 'Atrasada';
      return e.avanco > 0 ? 'Em andamento' : pl > 0 ? 'Atrasada' : 'Não iniciada';
    };

    // ---------- Uso sem internet ----------
    const ehErroRede = (e) => !!e && (e.rede || /failed to fetch|networkerror|load failed|network request failed|fetch failed/i.test(e.message || ''));
    const novoId = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
    const lerLocal = (chave, padrao) => { try { const v = localStorage.getItem(chave); return v ? JSON.parse(v) : padrao; } catch { return padrao; } };
    const gravarLocal = (chave, valor) => { try { localStorage.setItem(chave, JSON.stringify(valor)); return true; } catch { return false; } };
    const apagarLocal = (chave) => { try { localStorage.removeItem(chave); } catch {} };

    // Mostra na tela o efeito dos lançamentos que ainda estão na fila (estoque, presença, diário, EPI)
    function aplicarFila(base, fila) {
      const ativos = fila.filter(i => !i.erro);
      if (!ativos.length) return base;
      const d = { ...base, materiais: base.materiais.map(m => ({ ...m, estoques: { ...m.estoques } })),
        movimentacoes: [...base.movimentacoes], presencas: [...base.presencas], diarios: [...base.diarios], epis: [...base.epis] };
      const soma = (mat, obra, q) => { const m = d.materiais.find(x => x.id === mat); if (m && obra) m.estoques[obra] = (m.estoques[obra] || 0) + q; };
      for (const it of ativos) {
        const a = it.args;
        if (it.tipo === 'movimentacao') {
          const q = Number(a.qtd);
          soma(a.material, a.obra, a.tipo === 'Entrada' ? q : -q);
          if (a.tipo === 'Transferência') soma(a.material, a.obra_destino, q);
          d.movimentacoes.unshift({ id: it.id, data: tsLocal(it.quando), tipo: a.tipo, obraId: a.obra, obraDestinoId: a.obra_destino || null,
            materialId: a.material, qtd: q, responsavel: a.responsavel, obs: a.obs, estornada: false, pendente: true });
        } else if (it.tipo === 'presenca') {
          d.presencas = d.presencas.filter(x => !(x.funcionarioId === a.funcionario && x.dia === a.dia));
          if (a.presenca) d.presencas.push({ funcionarioId: a.funcionario, dia: a.dia, status: a.presenca });
        } else if (it.tipo === 'epi') {
          soma(a.material, a.obra, -Number(a.qtd));
          d.epis.unshift({ id: it.id, funcionario_id: a.funcionario, material_id: a.material, obra_id: a.obra, qtd: Number(a.qtd), ca: a.ca,
            troca_prevista: a.troca || null, dia: isoLocal(new Date(it.quando)), criado_em: it.quando, entregue_por: 'aguardando envio', pendente: true });
        } else if (it.tipo === 'diario') {
          const atual = d.diarios.find(x => x.obra_id === a.obra && x.dia === a.dia);
          const campos = { clima_manha: a.clima_manha, clima_tarde: a.clima_tarde, servicos: a.servicos, ocorrencias: a.ocorrencias, observacoes: a.observacoes, pendente: true };
          d.diarios = atual ? d.diarios.map(x => x === atual ? { ...x, ...campos } : x)
            : [{ id: it.id, obra_id: a.obra, dia: a.dia, autor_nome: a.autor, fotos: [], ...campos }, ...d.diarios];
        }
      }
      return d;
    }

    // Lança erro do Supabase de forma amigável
    const ok = ({ data, error }) => {
      if (error) {
        const msg = error.message || String(error);
        if (ehErroRede({ message: msg })) { const e = new Error('Sem conexão com a internet. Esta operação precisa de internet; tente de novo quando a conexão voltar.'); e.rede = true; throw e; }
        if (/row-level security|permission denied|Sem permissão/i.test(msg)) throw new Error('Seu perfil não tem permissão para esta operação.');
        if (/violates foreign key/i.test(msg)) throw new Error('Este registro está vinculado a outros lançamentos e não pode ser excluído.');
        if (/fornecedores_cnpj_unico/i.test(msg)) throw new Error('Já existe um fornecedor com este CNPJ.');
        if (/duplicate key.*codigo/i.test(msg)) throw new Error('Já existe um material com este código.');
        throw new Error(msg);
      }
      return data;
    };

      const [obras, materiais, estoques, movs, forns, compras, funcs, despesas, perfis, presencas, rems, presF, folhas, itensF, diarios, presDiario, documentos, epis, contratos, contItens, medicoes, medItens, etapas, etapaItens, avancoHist, cotacoes, cotItens, cotForns, cotPrecos, receitas, caixa, modelos, inspecoes, pendencias, portal, clienteObras, servicos, indices, producoes, prodFuncs, alertasDia, envios, notas, nfeMapas, tarefas] = (await Promise.all(consultas)).map(ok);

        const v = numBR(avancoEdit[e.id]);
        if (!(v >= 0 && v <= 100)) return alert('Informe um percentual entre 0 e 100.');
        executar(async () => { ok(await sb.rpc('atualizar_avanco', { p_etapa: e.id, p_avanco: v })); setAvancoEdit(a => { const n = { ...a }; delete n[e.id]; return n; }); });
      };
      // Colar do Excel: Etapa | Descrição | Unid | Qtd | Preço unit  (ou Etapa | Valor, ou Etapa | Descrição | Valor)
      const lerColagem = (texto) => {
        const linhas = []; let etapaAtual = '';
        for (const bruta of texto.split(/\r?\n/)) {
          if (!bruta.trim()) continue;
          const c = bruta.split(bruta.includes('\t') ? '\t' : ';').map(x => x.trim());
          let etapa = c[0] || etapaAtual, descricao, unidade = 'vb', qtd = 1, preco;
          if (c.length >= 5) { descricao = c[1]; unidade = c[2] || 'vb'; qtd = numBR(c[3]); preco = numBR(c[4]); }
          else if (c.length === 3 || c.length === 4) { descricao = c[1]; preco = numBR(c[c.length - 1]); }
          else if (c.length === 2) { descricao = 'Valor global'; preco = numBR(c[1]); }
          else continue;
          if (!etapa || !(qtd >= 0) || !(preco >= 0) || Number.isNaN(preco)) continue;   // cabeçalho ou linha inválida
          etapaAtual = etapa;
          linhas.push({ etapa, descricao: descricao || 'Valor global', unidade, qtd, preco });
        }
        return linhas;
      };
      const importarColagem = async (obraId) => {
        const linhas = lerColagem(colarTexto);
        if (!linhas.length) return alert('Não encontrei linhas válidas. Copie do Excel as colunas Etapa, Descrição, Unidade, Quantidade e Preço unitário.');
        const okS = await executar(async () => {
          let ordem = Math.max(0, ...data.etapas.filter(x => x.obra_id === obraId).map(x => x.ordem));
          const ids = {};
          for (const l of linhas) {
            const chave = l.etapa.toLowerCase();
            if (!ids[chave]) {
              const existe = data.etapas.find(x => x.obra_id === obraId && x.nome.toLowerCase() === chave);
              ids[chave] = existe ? existe.id : ok(await sb.from('etapas').insert({ obra_id: obraId, nome: l.etapa, ordem: ++ordem }).select().single()).id;
            }
          }
          const base = {};
          const rows = linhas.map(l => { const eid = ids[l.etapa.toLowerCase()]; base[eid] = (base[eid] ?? data.etapaItens.filter(i => i.etapa_id === eid).length) + 1;
            return { etapa_id: eid, descricao: l.descricao, unidade: l.unidade, qtd: l.qtd, preco_unit: r2(l.preco), ordem: base[eid] }; });
          ok(await sb.from('etapa_itens').insert(rows));
        });
        if (okS) { setColarModal(false); setColarTexto(''); }
      };

      // ---------- Medição de empreiteiro ----------
      const medRascunhos = data.medicoes.filter(m => m.status === 'Rascunho').length;
      const itensDoContrato = (cid) => data.contratoItens.filter(i => i.contrato_id === cid);
      const valorContrato = (cid) => itensDoContrato(cid).reduce((s, i) => s + Math.round(i.qtd * i.preco_unit * 100) / 100, 0);
      // quantidade já medida de um item: aprovadas (e, se informado, só as de número menor)
      const medidoAte = (itemId, ateNumero) => data.medicaoItens.reduce((s, mi) => {
        if (mi.item_id !== itemId) return s;
        const m = data.medicoes.find(x => x.id === mi.medicao_id);
        if (!m || m.status !== 'Aprovada' || (ateNumero !== undefined && m.numero >= ateNumero)) return s;
        return s + mi.qtd;
      }, 0);
      const abrirContrato = (c) => {
        setContratoForm(c ? { id: c.id, obraId: c.obra_id, etapaId: c.etapa_id || '', empreiteiro: c.empreiteiro, objeto: c.objeto, retencao: c.retencao_pct, status: c.status,
            itens: itensDoContrato(c.id).map(i => ({ id: i.id, descricao: i.descricao, unidade: i.unidade, qtd: i.qtd, preco: i.preco_unit })) }
          : { obraId: primeiraObra(), empreiteiro: '', objeto: '', retencao: 5, status: 'Ativo', itens: [{ descricao: '', unidade: 'm²', qtd: '', preco: '' }] });
        setContratoModal(true);
      };
      const salvarContrato = async (e) => {
        e.preventDefault();
        const f = contratoForm;
        const itens = f.itens.filter(i => i.descricao.trim());
        if (!f.empreiteiro.trim()) return alert('Informe o empreiteiro.');
        if (!itens.length) return alert('Inclua pelo menos um item no contrato.');
        if (itens.some(i => !(Number(i.qtd) > 0) || !(Number(i.preco) >= 0) || i.preco === '')) return alert('Cada item precisa de quantidade e preço unitário.');
        const ret = Number(f.retencao) || 0;
        if (ret < 0 || ret > 100) return alert('A retenção deve ficar entre 0 e 100%.');
        const okSalvo = await executar(async () => {
          const reg = { obra_id: f.obraId, empreiteiro: f.empreiteiro.trim(), objeto: (f.objeto || '').trim(), retencao_pct: ret, status: f.status,
                        etapa_id: data.etapas.some(x => x.id === f.etapaId && x.obra_id === f.obraId) ? f.etapaId : null };
          let id = f.id;
          if (id) ok(await sb.from('contratos').update(reg).eq('id', id));
          else id = ok(await sb.from('contratos').insert(reg).select().single()).id;
          const antigos = itensDoContrato(id);
          for (const a of antigos) if (!itens.some(i => i.id === a.id)) {
            const r = await sb.from('contrato_itens').delete().eq('id', a.id);
            if (r.error) throw new Error(`O item "${a.descricao}" já foi medido e não pode ser removido.`);
          }
          for (const [k, i] of itens.entries()) {
            const row = { descricao: i.descricao.trim(), unidade: i.unidade || 'un', qtd: Number(i.qtd), preco_unit: Number(i.preco), ordem: k + 1 };
            if (i.id) ok(await sb.from('contrato_itens').update(row).eq('id', i.id));
            else ok(await sb.from('contrato_itens').insert({ ...row, contrato_id: id }));
          }
          setContratoSel(id);
        });
        if (okSalvo) setContratoModal(false);
      };
      const abrirMedicao = (c, m) => {
        const itens = itensDoContrato(c.id);
        if (m) {
          setMedForm({ id: m.id, contratoId: c.id, numero: m.numero, ini: m.periodo_ini, fim: m.periodo_fim, obs: m.obs || '',
            qtds: Object.fromEntries(itens.map(i => [i.id, String(data.medicaoItens.find(x => x.medicao_id === m.id && x.item_id === i.id)?.qtd ?? '')])) });
        } else {
          const doContrato = data.medicoes.filter(x => x.contrato_id === c.id);
          if (doContrato.some(x => x.status === 'Rascunho')) return alert('Já existe uma medição em rascunho neste contrato. Aprove ou exclua antes de abrir outra.');
          const ult = doContrato[doContrato.length - 1];
          const ini = ult ? somaDiasDe(ult.periodo_fim, 1) : hojeISO().slice(0, 8) + '01';
          setMedForm({ contratoId: c.id, numero: (ult?.numero || 0) + 1, ini, fim: hojeISO() >= ini ? hojeISO() : ini, obs: '', qtds: {} });
        }
        setMedModal(true);
      };
      const salvarMedicao = async (e) => {
        e.preventDefault();
        const f = medForm;
        if (f.fim < f.ini) return alert('O fim do período não pode ser antes do início.');
        const itens = itensDoContrato(f.contratoId);
        for (const i of itens) {
          const q = Number(f.qtds[i.id] || 0);
          if (q < 0) return alert('Quantidade não pode ser negativa.');
          if (medidoAte(i.id, f.numero) + q > i.qtd + 1e-9) return alert(`"${i.descricao}": a quantidade acumulada passaria do contratado (${i.qtd} ${i.unidade}).`);
        }
        const okSalvo = await executar(async () => {
          const reg = { periodo_ini: f.ini, periodo_fim: f.fim, obs: (f.obs || '').trim() };
          let id = f.id;
          if (id) ok(await sb.from('medicoes').update(reg).eq('id', id));
          else id = ok(await sb.from('medicoes').insert({ ...reg, contrato_id: f.contratoId, numero: f.numero }).select().single()).id;
          ok(await sb.from('medicao_itens').delete().eq('medicao_id', id));
          const linhas = itens.map(i => ({ medicao_id: id, item_id: i.id, qtd: Number(f.qtds[i.id] || 0) })).filter(l => l.qtd > 0);
          if (linhas.length) ok(await sb.from('medicao_itens').insert(linhas));
        });
        if (okSalvo) setMedModal(false);
      };
      const aprovarMedicao = (m, c) => {
        const bruto = data.medicaoItens.filter(x => x.medicao_id === m.id).reduce((s, x) => s + Math.round(x.qtd * (data.contratoItens.find(i => i.id === x.item_id)?.preco_unit || 0) * 100) / 100, 0);
        const ret = Math.round(bruto * c.retencao_pct) / 100;
        if (!confirm(`Aprovar a medição nº ${m.numero}?\n\nValor medido: ${formatBRL(bruto)}\nRetenção (${c.retencao_pct}%): ${formatBRL(ret)}\nA pagar: ${formatBRL(bruto - ret)}\n\nSerá lançada uma despesa "Mão de Obra" (A pagar) no Financeiro, com vencimento 10 dias após o fim do período.`)) return;
        executar(async () => ok(await sb.rpc('aprovar_medicao', { p_id: m.id })));
      };
      const reabrirMedicao = (m) => {
        if (!confirm(`Reabrir a medição nº ${m.numero}? A despesa lançada no Financeiro será excluída e a medição volta a ser rascunho.`)) return;
        executar(async () => ok(await sb.rpc('reabrir_medicao', { p_id: m.id })));
      };
      const excluirMedicao = (m) => {
        if (!confirm(`Excluir o rascunho da medição nº ${m.numero}?`)) return;
        executar(async () => ok(await sb.from('medicoes').delete().eq('id', m.id)));
      };
      const excluirContrato = (c) => {
        if (data.medicoes.some(m => m.contrato_id === c.id)) return alert('Este contrato já tem medições. Para tirá-lo da lista, marque-o como Encerrado.');
        if (!confirm(`Excluir o contrato de ${c.empreiteiro}?`)) return;
        executar(async () => { ok(await sb.from('contratos').delete().eq('id', c.id)); setContratoSel(''); });
      };

      // ---------- EPI ----------
      const TROCA_AVISO = 15;
      const episTroca = data.epis.filter(e => e.troca_prevista && diasAte(e.troca_prevista) <= TROCA_AVISO &&
        !data.epis.some(o => o.funcionario_id === e.funcionario_id && o.material_id === e.material_id && (o.dia > e.dia || (o.dia === e.dia && o.criado_em > e.criado_em))));
      const ehEpi = (m) => /epi|segurança|seguranca/i.test(m.categoria) || /capacete|luva|bota|óculos|oculos|protetor|cinto|máscara|mascara|colete|botina|abafador|respirador/i.test(m.nome);
      const abrirEntregaEpi = (funcId, materialId) => {
        if (!data.funcionarios.length) return alert('Cadastre os funcionários antes.');
        const f = data.funcionarios.find(x => x.id === funcId) || data.funcionarios[0];
        const mats = [...data.materiais].sort((a, b) => ehEpi(b) - ehEpi(a));
        setEpiForm({ funcionarioId: f.id, obraId: f.obraId || primeiraObra(), materialId: materialId || mats[0]?.id || '', qtd: 1, ca: '', troca: somaDias(90) });
        setEpiModal(true);
      };
      const salvarEntregaEpi = async (e) => {
        e.preventDefault();
        const qtd = Number(epiForm.qtd);
        if (!(qtd > 0)) return alert('Informe a quantidade.');
        const saldo = getMat(epiForm.materialId)?.estoques[epiForm.obraId] || 0;
        if (qtd > saldo) return alert(`Saldo insuficiente na obra (disponível: ${saldo}).`);
        const fu = data.funcionarios.find(x => x.id === epiForm.funcionarioId);
        if (await lancar('epi', { funcionario: epiForm.funcionarioId, material: epiForm.materialId, obra: epiForm.obraId,
              qtd, ca: (epiForm.ca || '').trim(), troca: epiForm.troca || '' },
            `EPI: ${qtd} ${getMat(epiForm.materialId)?.nome} para ${fu?.nome}`,
            async () => ok(await sb.rpc('entregar_epi', {
              p_funcionario: epiForm.funcionarioId, p_material: epiForm.materialId, p_obra: epiForm.obraId,
              p_qtd: qtd, p_ca: (epiForm.ca || '').trim(), p_troca: epiForm.troca || null })))) setEpiModal(false);
      };
      const cancelarEntregaEpi = (ent) => {
        if (!confirm('Cancelar esta entrega de EPI? O material volta para o estoque da obra.')) return;
        executar(async () => ok(await sb.rpc('cancelar_entrega_epi', { p_id: ent.id })));
      };

      // ---------- Folha de pagamento ----------
      const fecharFolha = (itens) => {
        const total = itens.reduce((s, i) => s + i.total, 0);
        if (!confirm(`Fechar a folha de ${rotuloMes(mesFolha)} no total de ${formatBRL(total)}?\n\nSerá lançada uma despesa "Mão de Obra" (A pagar) para cada obra, com vencimento no dia 5 do mês seguinte.`)) return;
        const aj = {};
        Object.entries(ajustesFolha).forEach(([fid, a]) => { const v = Number(a.valor); if (v) aj[fid] = { valor: v, obs: a.obs || '' }; });
        executar(async () => ok(await sb.rpc('fechar_folha', { p_mes: mesFolha, p_ajustes: aj })));
      };
      const reabrirFolha = () => {
        if (!confirm(`Reabrir a folha de ${rotuloMes(mesFolha)}?\n\nAs despesas lançadas por ela serão apagadas do Financeiro, e você poderá fechar de novo.`)) return;
        executar(async () => ok(await sb.rpc('reabrir_folha', { p_mes: mesFolha })));
      };

      // ---------- Exclusões (com bloqueio quando há vínculos) ----------
      const excluirObra = (obra) => {
        const temEstoque = data.materiais.some(m => (m.estoques[obra.id] || 0) > 0);
        const temVinculo = data.movimentacoes.some(m => m.obraId === obra.id || m.obraDestinoId === obra.id)
          || data.compras.some(c => c.obraId === obra.id) || data.despesas.some(d => d.obraId === obra.id)
          || data.funcionarios.some(f => f.obraId === obra.id);
        if (temEstoque || temVinculo) {
          return alert('Esta obra já tem estoque, movimentações, compras, despesas ou funcionários vinculados e não pode ser excluída.\n\nUse "Editar" e altere o status para "Concluída" ou "Paralisada".');
        }
        if (!confirm(`Excluir a obra "${obra.nome}"?`)) return;
        if (selectedObra === obra.id) setSelectedObra('ALL');
        executar(async () => ok(await sb.from('obras').delete().eq('id', obra.id)));
      };

      const excluirMaterial = (mat) => {
        const saldo = Object.values(mat.estoques).reduce((s, v) => s + Number(v || 0), 0);
        const temVinculo = data.movimentacoes.some(m => m.materialId === mat.id) || data.compras.some(c => c.materialId === mat.id);
        if (saldo > 0 || temVinculo) {
          return alert('Este material tem saldo em estoque ou histórico de movimentações/compras e não pode ser excluído. Você pode editar o nome, a unidade ou o mínimo.');
        }
        if (!confirm(`Excluir o material "${mat.nome}"?`)) return;
        executar(async () => ok(await sb.from('materiais').delete().eq('id', mat.id)));
      };

      const excluirFornecedor = (forn) => {
        if (data.compras.some(c => c.fornecedorId === forn.id)) return alert('Este fornecedor tem compras registradas e não pode ser excluído.');
        if (!confirm(`Excluir o fornecedor "${forn.nome}"?`)) return;
        executar(async () => ok(await sb.from('fornecedores').delete().eq('id', forn.id)));
      };

      const cancelarCompra = (compra) => {
        if (!confirm('Cancelar esta solicitação de compra?')) return;
        executar(async () => ok(await sb.from('compras').update({ status: 'Cancelado' }).eq('id', compra.id)));
      };

      const excluirDespesa = (desp) => {
        if (!confirm(`Excluir a despesa "${desp.descricao}" (${formatBRL(desp.valor)})?`)) return;
        executar(async () => ok(await sb.from('despesas').delete().eq('id', desp.id)));
      };

      const excluirFuncionario = (func) => {
        if (!confirm(`Excluir o funcionário "${func.nome}"?`)) return;
        executar(async () => ok(await sb.from('funcionarios').delete().eq('id', func.id)));
      };

      // ---------- Estoque: tudo pelas funções do banco (transação única, saldo validado no servidor) ----------
      const getObraNome = (id) => data.obras.find(o => o.id === id)?.nome || 'Obra';
      const getMat = (id) => data.materiais.find(m => m.id === id);

      const estornarMov = (mv) => {
        const mat = getMat(mv.materialId);
        if (!confirm(`Estornar esta ${mv.tipo.toLowerCase()} de ${mv.qtd} ${mat?.unidade || ''} de ${mat?.nome || 'material'}?\n\nO registro original será mantido e um lançamento de estorno será criado.`)) return;
        executar(async () => ok(await sb.rpc('estornar_movimentacao', { p_id: mv.id })));
      };

      const alertasEstoque = useMemo(() => {
        const list = [];
        data.materiais.forEach(mat => {
          data.obras.forEach(obra => {
            if (obra.status === 'Concluída') return;
            if (selectedObra !== 'ALL' && selectedObra !== obra.id) return;
            const saldo = mat.estoques[obra.id] || 0;
            if (saldo <= mat.min) list.push({ mat, obra, saldo });
          });
        });
        return list;
      }, [data.materiais, data.obras, selectedObra]);

      const handleSaveMov = async (e) => {
        e.preventDefault();
        if (!can('mov.' + movModal)) return alert('Seu perfil não tem permissão para esta operação.');
        const qtd = Number(movForm.qtd);
        if (!(qtd > 0) || !movForm.responsavel.trim()) return alert('Informe a quantidade e o responsável.');
        if (movModal === 'Transferência' && movForm.obraId === movForm.obraDestinoId) {
          return alert('A obra de destino deve ser diferente da obra de origem.');
        }
        const mat = getMat(movForm.materialId);
        const saldoAtual = mat?.estoques[movForm.obraId] || 0;
        if ((movModal === 'Saída' || movModal === 'Transferência') && qtd > saldoAtual) {
          return alert(`Saldo insuficiente na obra selecionada (Disponível: ${saldoAtual} ${mat?.unidade}).`);
        }
        const okGravou = await lancar('movimentacao', {
            tipo: movModal, obra: movForm.obraId, obra_destino: movModal === 'Transferência' ? movForm.obraDestinoId : '',
            material: movForm.materialId, qtd, responsavel: movForm.responsavel, obs: movForm.obs || '-' },
          `${movModal}: ${qtd} ${mat?.unidade || ''} de ${mat?.nome} — ${getObraNome(movForm.obraId)}`,
          async () => ok(await sb.rpc('registrar_movimentacao', {
            p_tipo: movModal, p_obra: movForm.obraId,
            p_obra_destino: movModal === 'Transferência' ? movForm.obraDestinoId : null,
            p_material: movForm.materialId, p_qtd: qtd, p_responsavel: movForm.responsavel, p_obs: movForm.obs || '-'
          })));
        if (okGravou) setMovModal(null);
      };

      const handleConfirmarEntregaCompra = (compra) => {
        if (!can('compra.receber')) return alert('Seu perfil não tem permissão para receber compras.');
        if (!confirm('Confirmar o recebimento desta compra? O material entrará no estoque e a despesa será lançada.')) return;
        executar(async () => ok(await sb.rpc('receber_compra', { p_id: compra.id })));
      };

      if (!SUPABASE_CONFIGURADO) {
        return (
          <Moldura>
            <h2 className="font-extrabold text-slate-900">Configuração pendente</h2>
            <p className="text-sm text-slate-600">
              Abra o arquivo <code className="bg-slate-100 px-1 rounded">index.html</code> e preencha
              <code className="bg-slate-100 px-1 rounded">SUPABASE_URL</code> e
              <code className="bg-slate-100 px-1 rounded">SUPABASE_ANON_KEY</code> com os dados do seu projeto
              (Supabase → Project Settings → API). O passo a passo está no README.
            </p>
          </Moldura>
        );
      }

      if (carregandoSessao) {
        return <Moldura><p className="text-sm text-slate-500 text-center">Carregando…</p></Moldura>;
      }

      if (!user) {
        return (
          <Moldura>
            <h2 className="font-extrabold text-slate-900">{modoCadastro ? 'Criar conta' : 'Entrar'}</h2>
            <form onSubmit={modoCadastro ? handleCadastro : handleLogin} className="space-y-4">
              {modoCadastro && (
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Nome</label>
                  <input type="text" value={cadastroNome} onChange={e => setCadastroNome(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" required />
                </div>
              )}
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">E-mail</label>
                <input type="email" autoComplete="username" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" required />
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Senha</label>
                <input type="password" autoComplete={modoCadastro ? 'new-password' : 'current-password'} minLength={modoCadastro ? 8 : undefined} value={loginSenha} onChange={e => setLoginSenha(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" required />
              </div>
              {loginErro && <p className="text-sm font-semibold text-red-600">{loginErro}</p>}
              {loginInfo && <p className="text-sm font-semibold text-emerald-700">{loginInfo}</p>}
              <button type="submit" disabled={enviando} className="w-full bg-slate-900 hover:bg-slate-800 disabled:opacity-50 text-white font-bold py-2.5 rounded-lg transition">
                {enviando ? 'Aguarde…' : modoCadastro ? 'Criar conta' : 'Entrar no Sistema'}
              </button>
            </form>
            <div className="pt-4 border-t border-slate-100 flex justify-between text-xs font-bold">
              <button type="button" onClick={() => { setModoCadastro(!modoCadastro); setLoginErro(''); setLoginInfo(''); }} className="text-slate-700 hover:underline">

                  {f.erro && <p className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{f.erro}</p>}
                  <div className="flex justify-end"><button type="button" onClick={fecharNF} className="px-4 py-2 border rounded-lg font-bold">Fechar</button></div>
                </div>
              </div>
            );
            const nf = f.nf, fq = (v) => Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
            const fornSel = data.fornecedores.find(x => x.id === f.fornecedorId);
            const etapasObra = data.etapas.filter(e => e.obra_id === f.obraId);
            const noEstoque = f.itens.filter(i => i.materialId).length;
            const comPedido = f.itens.filter(i => i.materialId && i.compraId).length;
            const somaParc = f.parcelas.reduce((s, x) => s + (Number(x.valor) || 0), 0);
            const lbl = 'block text-xs font-bold uppercase text-slate-500';
            const inp = 'w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900';
            return (
              <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl max-w-3xl w-full p-6 space-y-4 max-h-[95vh] overflow-y-auto text-sm">
                  <div>
                    <p className="text-xs font-bold uppercase tracking-wider text-slate-500">Conferir nota fiscal</p>
                    <h3 className="text-xl font-extrabold text-slate-900">NF {nf.numero}{nf.serie ? `-${nf.serie}` : ''} · {formatBRL(nf.valorTotal)}</h3>
                    <p className="text-slate-600">{nf.emitente.nome} · CNPJ {nf.emitente.cnpj || '—'} · emitida em {fmtData(nf.emissao)}</p>
                    <p className="text-[11px] text-slate-400 font-mono mt-0.5">{fmtChave(nf.chave)}</p>
                  </div>
                  {(nf.avisos.length > 0 || f.porNome) && (
                    <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-amber-900 space-y-1">
                      {nf.avisos.map((a, k) => <p key={k}>⚠️ {a}</p>)}
                      {f.porNome && <p>O fornecedor foi reconhecido pelo nome. Confira; ao lançar, o CNPJ fica gravado no cadastro dele.</p>}
                    </div>
                  )}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <label className={lbl}>Fornecedor
                      <select value={f.fornecedorId} onChange={e => mudarNF('fornecedorId', e.target.value)} className={inp}>
                        <option value="">➕ Cadastrar: {nf.emitente.nome}</option>
                        {data.fornecedores.map(x => <option key={x.id} value={x.id}>{x.nome}</option>)}
                      </select>
                    </label>
                    <label className={lbl}>Obra que recebeu
                      <select value={f.obraId} onChange={e => mudarNF('obraId', e.target.value)} className={inp}>
                        {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                      </select>
                    </label>
                    {user.perfil === 'Engenheiro' && etapasObra.length > 0 && (
                      <label className={lbl}>Etapa do orçamento
                        <select value={f.etapaId} onChange={e => mudarNF('etapaId', e.target.value)} className={inp}>
                          <option value="">— sem etapa —</option>
                          {etapasObra.map(e => <option key={e.id} value={e.id}>{e.nome}</option>)}
                        </select>
                      </label>
                    )}
                  </div>

                  <div className="space-y-2">
                    <p className="text-xs font-bold uppercase text-slate-500">Itens da nota ({f.itens.length})</p>
                    {f.itens.map((it, k) => {
                      const mat = getMat(it.materialId), fat = numBR(it.fator) || 0;
                      const cands = it.materialId ? data.compras.filter(c => c.materialId === it.materialId && c.obraId === f.obraId && (c.status === 'Solicitado' || c.status === 'Comprado')) : [];
                      return (
                        <div key={k} className={`border rounded-xl p-3 space-y-2 ${it.materialId ? 'border-slate-200' : 'border-dashed border-slate-300 bg-slate-50'}`}>
                          <div>
                            <p className="font-bold text-slate-900">{it.descricao}</p>
                            <p className="text-xs text-slate-500">{it.codigo ? `Cód. ${it.codigo} · ` : ''}{fq(it.qtd)} {it.unidade} × {formatBRL(it.valorUnit)} = <strong className="text-slate-700">{formatBRL(it.valorTotal)}</strong></p>
                          </div>
                          <div className="grid grid-cols-12 gap-2 items-end">
                            <label className={`${lbl} col-span-12 sm:col-span-6`}>Material no SIGO
                              {it.origem === 'mapa' && <span className="ml-1 normal-case font-semibold text-emerald-700">· lembrado da última nota</span>}
                              {it.origem === 'sugestao' && <span className="ml-1 normal-case font-semibold text-amber-700">· sugerido, confira</span>}
                              <select value={it.materialId} onChange={e => mudarItemNF(k, 'materialId', e.target.value)} className={inp}>
                                <option value="">— não entra no estoque —</option>
                                {data.materiais.map(m => <option key={m.id} value={m.id}>{m.nome} ({m.unidade})</option>)}
                              </select>
                            </label>
                            {it.materialId && (
                              <label className={`${lbl} col-span-4 sm:col-span-2`} title={`Quantos ${mat?.unidade} há em 1 ${it.unidade} da nota`}>Fator
                                <input value={it.fator} inputMode="decimal" onChange={e => mudarItemNF(k, 'fator', e.target.value)} className={inp} />
                              </label>
                            )}
                            {it.materialId && (
                              <label className={`${lbl} col-span-8 sm:col-span-4`}>Pedido atendido
                                <select value={it.compraId} onChange={e => mudarItemNF(k, 'compraId', e.target.value)} className={inp}>
                                  <option value="">— nenhum —</option>
                                  {cands.map(c => <option key={c.id} value={c.id}>{fq(c.qtd)} {mat?.unidade} · {data.fornecedores.find(x => x.id === c.fornecedorId)?.nome || 'sem fornecedor'} · {c.status === 'Comprado' ? 'Aprovado' : c.status}</option>)}
                                </select>
                              </label>
                            )}
                          </div>
                          {it.materialId && mat && (
                            <p className="text-xs text-slate-600">Entra no estoque: <strong>{fq(it.qtd * fat)} {mat.unidade}</strong>
                              {!mesmaUnidade(it.unidade, mat.unidade) && <span className="text-amber-700 font-semibold"> · a nota está em "{it.unidade}" e o material em "{mat.unidade}": confira o fator</span>}
                              {it.compraId && (() => { const c = data.compras.find(x => x.id === it.compraId); return c && Math.abs(c.qtd - it.qtd * fat) > 0.0005 ? <span className="text-amber-700 font-semibold"> · pedido era de {fq(c.qtd)} {mat.unidade}</span> : null; })()}
                            </p>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="bg-slate-50 rounded-xl p-3 space-y-1">
                      <div className="flex justify-between"><span className="text-slate-500">Produtos</span><span>{formatBRL(nf.valorProdutos)}</span></div>
                      {nf.frete > 0 && <div className="flex justify-between"><span className="text-slate-500">Frete</span><span>{formatBRL(nf.frete)}</span></div>}
                      {nf.desconto > 0 && <div className="flex justify-between"><span className="text-slate-500">Desconto</span><span>− {formatBRL(nf.desconto)}</span></div>}
                      <div className="flex justify-between font-bold border-t border-slate-200 pt-1"><span>Total da nota</span><span>{formatBRL(nf.valorTotal)}</span></div>
                    </div>
                    <div className="space-y-2">
                      <p className="text-xs font-bold uppercase text-slate-500">Contas a pagar que serão criadas</p>
                      {f.parcelas.length ? f.parcelas.map((x, k) => (
                        <div key={k} className="flex items-center gap-2">
                          <span className="text-xs text-slate-500 w-16">Parc. {k + 1}</span>
                          <input type="date" value={x.vencimento} onChange={e => setNfForm({ ...f, parcelas: f.parcelas.map((y, j) => j === k ? { ...y, vencimento: e.target.value } : y) })} className="border rounded-lg px-2 py-1.5 text-sm" />
                          <span className="font-bold ml-auto">{formatBRL(x.valor)}</span>
                        </div>
                      )) : (
                        <div className="flex items-center gap-2">
                          <span className="text-xs text-slate-500">Vencimento</span>
                          <input type="date" value={f.vencimento} onChange={e => setNfForm({ ...f, vencimento: e.target.value })} className="border rounded-lg px-2 py-1.5 text-sm" />
                          <span className="font-bold ml-auto">{formatBRL(nf.valorTotal)}</span>
                        </div>
                      )}
                      {f.parcelas.length > 0 && Math.abs(somaParc - nf.valorTotal) > 0.01 && <p className="text-xs text-amber-700 font-semibold">As parcelas somam {formatBRL(somaParc)}, diferente do total da nota.</p>}
                    </div>
                  </div>

                  <p className="text-xs text-slate-500">Ao lançar: {noEstoque} {noEstoque === 1 ? 'item entra' : 'itens entram'} no estoque de {getObraNome(f.obraId)}{comPedido ? `, ${comPedido} ${comPedido === 1 ? 'pedido é baixado' : 'pedidos são baixados'}` : ''}{fornSel ? '' : ', o fornecedor é cadastrado'} e {f.parcelas.length || 1} {(f.parcelas.length || 1) === 1 ? 'conta a pagar é criada' : 'contas a pagar são criadas'} no Financeiro.</p>
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={fecharNF} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="button" disabled={enviando} onClick={salvarNF} className="disabled:opacity-50 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold">Lançar nota</button>
                  </div>
                </div>
              </div>
            );
          })()}

          {cotForm && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 max-h-[95vh] overflow-y-auto">
                <h3 className="text-lg font-extrabold">{cotForm.id ? 'Itens e fornecedores da cotação' : 'Nova cotação'}</h3>
                <form onSubmit={salvarCotForm} className="space-y-3 text-sm">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label className="block text-xs font-bold uppercase text-slate-500">Nome
                      <input value={cotForm.titulo} onChange={e => setCotForm({ ...cotForm, titulo: e.target.value })} placeholder="Ex.: Concreto e aço — 3º pavimento" className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900" required />
                    </label>
                    <label className="block text-xs font-bold uppercase text-slate-500">Obra
                      <select value={cotForm.obraId} onChange={e => setCotForm({ ...cotForm, obraId: e.target.value })} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm font-normal normal-case text-slate-900">
                        {data.obras.map(o => <option key={o.id} value={o.id}>{o.nome}</option>)}
                      </select>
                    </label>
                  </div>
                  <div className="space-y-2">
                    <p className="text-xs font-bold uppercase text-slate-500">Materiais</p>
                    {cotForm.itens.map((it, k) => {
                      const set = (campo, v) => setCotForm({ ...cotForm, itens: cotForm.itens.map((x, j) => j === k ? { ...x, [campo]: v } : x) });
                      return (
                        <div key={k} className="grid grid-cols-12 gap-2 items-center">
                          <select value={it.materialId} onChange={e => set('materialId', e.target.value)} className="col-span-8 border rounded-lg px-2 py-2">
                            {data.materiais.map(m => <option key={m.id} value={m.id}>{m.nome} ({m.unidade})</option>)}
                          </select>
                          <input type="number" min="0" step="any" value={it.qtd} onChange={e => set('qtd', e.target.value)} placeholder="Qtd" className="col-span-3 border rounded-lg px-2 py-2" />
                          <button type="button" title="Remover" onClick={() => setCotForm({ ...cotForm, itens: cotForm.itens.filter((_, j) => j !== k) })} className="col-span-1 text-red-600 font-bold text-lg">×</button>
                        </div>
                      );
                    })}
                    <button type="button" onClick={() => setCotForm({ ...cotForm, itens: [...cotForm.itens, { materialId: data.materiais[0]?.id || '', qtd: '' }] })} className="text-xs font-bold text-amber-700 hover:underline">+ Adicionar material</button>
                  </div>
                  <div className="space-y-2">
                    <p className="text-xs font-bold uppercase text-slate-500">Fornecedores consultados</p>
                    <div className="flex flex-wrap gap-2">
                      {data.fornecedores.map(fo => { const marc = cotForm.forns.includes(fo.id); return (
                        <button key={fo.id} type="button" onClick={() => setCotForm({ ...cotForm, forns: marc ? cotForm.forns.filter(x => x !== fo.id) : [...cotForm.forns, fo.id] })}
                          className={`px-3 py-1.5 rounded-lg border text-xs font-bold ${marc ? 'bg-slate-900 text-white border-slate-900' : 'border-slate-300 text-slate-600'}`}>{marc ? '✓ ' : ''}{fo.nome}</button>
                      ); })}
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setCotForm(null)} className="px-4 py-2 border rounded-lg font-bold">Cancelar</button>
                    <button type="submit" disabled={enviando} className="disabled:opacity-50 px-4 py-2 bg-slate-900 text-white rounded-lg font-bold">Salvar e preencher preços</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {mapa && mapa.precos && (() => {
            const c = data.cotacoes.find(x => x.id === mapa.id); if (!c) return null;
            const aberta = c.status === 'Aberta';
            const itens = data.cotacaoItens.filter(i => i.cotacao_id === c.id);
            const forns = data.cotacaoForns.filter(x => x.cotacao_id === c.id).map(x => data.fornecedores.find(f => f.id === x.fornecedor_id)).filter(Boolean);
            const preco = (i, fo) => { const v = mapa.precos[i.id + '|' + fo.id]; const n = numBR(v); return v === undefined || v === '' || Number.isNaN(n) ? null : n; };
            const menor = (i) => { let best = null; forns.forEach(fo => { const p = preco(i, fo); if (p !== null && (best === null || p < best.p)) best = { fo: fo.id, p }; }); return best; };
            const escolha = (i) => mapa.escolha[i.id] || menor(i)?.fo;
            const totalForn = (fo) => itens.reduce((s, i) => s + (preco(i, fo) ?? 0) * i.qtd, 0);
            const completos = (fo) => itens.every(i => preco(i, fo) !== null);
            const totalEscolhido = itens.reduce((s, i) => { const fo = forns.find(f => f.id === escolha(i)); return s + (fo ? (preco(i, fo) ?? 0) * i.qtd : 0); }, 0);
            const melhorUnico = forns.filter(completos).map(fo => ({ fo, t: totalForn(fo) })).sort((a, b) => a.t - b.t)[0];
            const faltaPreco = itens.some(i => { const fo = forns.find(f => f.id === escolha(i)); return !fo || preco(i, fo) === null; });
            const compras = !aberta ? data.compras.filter(x => x.obraId === c.obra_id && c.aprovada_em) : [];
            const setPreco = (i, fo, v) => setMapa({ ...mapa, precos: { ...mapa.precos, [i.id + '|' + fo.id]: v } });
            const setForn = (fo, campo, v) => setMapa({ ...mapa, forns: { ...mapa.forns, [fo.id]: { ...mapa.forns[fo.id], [campo]: v } } });
            const imprimir = () => { document.body.classList.add('imprimindo-ficha'); window.print(); document.body.classList.remove('imprimindo-ficha'); };
            const td = 'px-3 py-2 border border-slate-200';
            return (
              <div className="ficha-epi fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl max-w-6xl w-full p-6 space-y-4 max-h-[95vh] overflow-y-auto text-sm">
                  <div className="flex flex-wrap justify-between items-start gap-3">
                    <div>
                      <p className="text-xs font-bold uppercase tracking-wider text-slate-500">Mapa de cotação</p>
                      <h3 className="text-xl font-extrabold text-slate-900">{c.titulo}</h3>
                      <p className="text-slate-600">{getObraNome(c.obra_id)} · {c.status}{c.aprovada_por ? ` por ${c.aprovada_por} em ${fmtData(isoLocal(new Date(c.aprovada_em)))}` : ''}</p>
                    </div>
                    <div className="no-print flex gap-2">
                      <button type="button" onClick={imprimir} className="flex items-center gap-1.5 px-3 py-2 border border-slate-300 rounded-lg text-xs font-bold hover:bg-slate-100"><Icon name="print" className="w-4 h-4" /> Imprimir</button>
                      <button type="button" onClick={() => setMapa(null)} className="px-3 py-2 border border-slate-300 rounded-lg text-xs font-bold">Fechar</button>
                    </div>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-100 text-xs uppercase font-bold text-slate-600">
                          <th className={td}>Material</th><th className={td + ' text-right'}>Qtd</th>
                          {forns.map(fo => <th key={fo.id} className={td + ' text-center min-w-[150px]'}>{fo.nome}</th>)}
                        </tr>
                      </thead>
                      <tbody>
                        {itens.map(i => { const m = getMat(i.material_id), mn = menor(i); return (
                          <tr key={i.id}>
                            <td className={td + ' font-semibold'}>{m?.nome}</td>
                            <td className={td + ' text-right whitespace-nowrap'}>{i.qtd.toLocaleString('pt-BR')} {m?.unidade}</td>
                            {forns.map(fo => { const p = preco(i, fo), ehMenor = mn && mn.fo === fo.id && p !== null, esc = escolha(i) === fo.id; return (
                              <td key={fo.id} className={`${td} ${ehMenor ? 'bg-emerald-50' : ''}`}>
                                <div className="flex items-center gap-1.5">
                                  <input type="radio" name={'esc-' + i.id} checked={!!esc && p !== null} disabled={!aberta || p === null} onChange={() => setMapa({ ...mapa, escolha: { ...mapa.escolha, [i.id]: fo.id } })} title="Comprar deste fornecedor" className="no-print" />
                                  {aberta ? <input inputMode="decimal" value={mapa.precos[i.id + '|' + fo.id] ?? ''} onChange={e => setPreco(i, fo, e.target.value)} placeholder="R$ unit." className="w-24 border rounded px-2 py-1 text-right" aria-label={`Preço de ${fo.nome} para ${m?.nome}`} />
                                    : <span className="w-24 text-right">{p !== null ? formatBRL(p) : '—'}</span>}
                                  {ehMenor && <span className="text-[10px] font-bold text-emerald-700">menor</span>}
                                </div>
                                {p !== null && <p className="text-[11px] text-slate-500 mt-0.5 text-right">{formatBRL(p * i.qtd)}</p>}
                              </td>
                            ); })}
                          </tr>
                        ); })}
                        <tr className="bg-slate-50 font-bold">
                          <td className={td} colSpan={2}>Total do fornecedor</td>
                          {forns.map(fo => <td key={fo.id} className={`${td} text-right ${melhorUnico?.fo.id === fo.id ? 'text-emerald-700' : ''}`}>{formatBRL(totalForn(fo))}{!completos(fo) && <span className="block text-[10px] font-normal text-slate-500">faltam preços</span>}</td>)}
                        </tr>
                        <tr>
                          <td className={td + ' text-xs font-bold uppercase text-slate-500'} colSpan={2}>Entrega prevista</td>
                          {forns.map(fo => <td key={fo.id} className={td}>{aberta ? <input type="date" value={mapa.forns[fo.id]?.prazo || ''} onChange={e => setForn(fo, 'prazo', e.target.value)} className="w-full border rounded px-2 py-1 text-xs" /> : fmtData(mapa.forns[fo.id]?.prazo)}</td>)}
                        </tr>
                        <tr>
                          <td className={td + ' text-xs font-bold uppercase text-slate-500'} colSpan={2}>Pagamento</td>
                          {forns.map(fo => <td key={fo.id} className={td}>{aberta ? <input value={mapa.forns[fo.id]?.condicao || ''} onChange={e => setForn(fo, 'condicao', e.target.value)} placeholder="Ex.: 28 dias" className="w-full border rounded px-2 py-1 text-xs" /> : (mapa.forns[fo.id]?.condicao || '—')}</td>)}
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3">
                      <p className="text-xs font-bold uppercase text-emerald-800">Comprando como marcado</p>
                      <p className="text-xl font-extrabold text-emerald-900">{formatBRL(totalEscolhido)}</p>
                      <p className="text-xs text-emerald-800">Cada item com o fornecedor marcado (padrão: o menor preço).</p>
                    </div>
                    <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                      <p className="text-xs font-bold uppercase text-slate-500">Tudo num fornecedor só</p>
                      <p className="text-xl font-extrabold">{melhorUnico ? formatBRL(melhorUnico.t) : '—'}</p>
                      <p className="text-xs text-slate-500">{melhorUnico ? `${melhorUnico.fo.nome}${melhorUnico.t > totalEscolhido ? ` · ${formatBRL(melhorUnico.t - totalEscolhido)} a mais` : ''}` : 'nenhum fornecedor cotou todos os itens'}</p>
                    </div>
                  </div>
                  {aberta && (
                    <div className="no-print flex flex-wrap justify-end gap-2">
                      <button type="button" disabled={enviando} onClick={salvarMapa} className="disabled:opacity-50 px-4 py-2 border border-slate-300 rounded-lg font-bold">Salvar preços</button>
                      {user.perfil === 'Engenheiro'
                        ? <button type="button" disabled={enviando || faltaPreco} onClick={() => aprovarCotacao(Object.fromEntries(itens.map(i => [i.id, escolha(i)])), totalEscolhido)} className="disabled:opacity-50 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold">Aprovar e gerar compras</button>
                        : <span className="text-xs text-slate-500 self-center">Salve os preços; a aprovação é do Engenheiro.</span>}
                    </div>
                  )}
                  {!aberta && c.status === 'Aprovada' && <p className="text-xs text-slate-500">As compras geradas estão na lista de compras como <b>Aprovado</b>.</p>}
                  <div className="hidden print:grid grid-cols-2 gap-10 pt-10 text-xs text-center text-slate-600">
                    <div className="border-t border-slate-400 pt-1">Cotado por</div>
                    <div className="border-t border-slate-400 pt-1">Aprovado por</div>
                  </div>
                </div>
              </div>
            );
          })()}
